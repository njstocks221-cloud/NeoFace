      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoFace-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NeoFace build ${{ github.run_number }}
          body: |
            NeoFace Android debug build.

            Download app-debug.apk, install it, and enter your API
            key and HTTPS server address in Settings.

            This build uses the configured server's /v1/api/search
            endpoint and expects a JSON results array.

            Only upload images you have permission to use.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
