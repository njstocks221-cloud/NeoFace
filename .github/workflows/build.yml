name: Build NeoFace APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Create NeoFace project
        run: |
          mkdir -p app/src/main/java/com/neoface
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          printf 'sdk.dir=/usr/local/lib/android/sdk\n' > local.properties

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NeoFace"
          include(":app")
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.neoface"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.neoface"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.4"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              packaging {
                  resources {
                      excludes += "META-INF/*"
                  }
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))

              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.activity:activity-compose:1.8.2")

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")

              debugImplementation("androidx.compose.ui:ui-tooling")

              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.google.code.gson:gson:2.10.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.GET_CONTENT" />
                      <category android:name="android.intent.category.OPENABLE" />
                      <data android:mimeType="image/*" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_neo_logo"
                  android:label="NeoFace"
                  android:roundIcon="@drawable/ic_neo_logo"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.NeoFace"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.NeoFace" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#0A0E27</item>
                  <item name="android:navigationBarColor">#0A0E27</item>
                  <item name="android:windowBackground">#0A0E27</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">NeoFace</string>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_neo_logo.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#0A0E27"
                  android:pathData="M0,0h108v108h-108z" />

              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#7C4DFF"
                  android:strokeWidth="3"
                  android:pathData="M54,14 A40,40 0 1,1 53.99,14 Z" />

              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#00E5FF"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:strokeWidth="6"
                  android:pathData="M36,76 L36,32 L72,76 L72,32" />

              <path
                  android:fillColor="#00E5FF"
                  android:pathData="M46,46 m-3.5,0 a3.5,3.5 0 1,0 7,0 a3.5,3.5 0 1,0 -7,0" />

              <path
