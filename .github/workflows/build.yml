      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoFace-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: social-${{ github.run_number }}
          name: NeoFace Social Links ${{ github.run_number }}
          body: |
            NeoFace social-links-only Android debug build.

            Results display social URLs only.
            Tap a result to try its official installed Android app.
            If the app cannot handle the link, use the normal web handler.

            Enter your API key and HTTPS server address in Settings.
            The configured endpoint must return a JSON results array.

            Only accounts returned by the search provider can be shown.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
