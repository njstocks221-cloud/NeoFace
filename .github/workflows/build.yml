      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoFace-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NeoFace v1.0.${{ github.run_number }}
          body: |
            ## NeoFace v1.0.${{ github.run_number }}

            אפליקציית חיפוש פנים הפוך עם לוגו חדש ומקצועי.

            ### התקנה
            1. הורד את `app-debug.apk` למטה
            2. אפשר "התקנה ממקורות לא ידועים" בהגדרות המכשיר
            3. התקן ופתח
            4. היכנס להגדרות → הזן מפתח FaceSeek API חינמי
            5. התחל לחפש

            ### קבלת מפתח חינמי
            הירשם ב-https://www.faceseek.online (יש מכסה יומית חינמית).
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
