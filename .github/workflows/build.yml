                          "face.jpg",
                          photo.asRequestBody("image/jpeg".toMediaType())
                      )
                      .build()

                  val request = Request.Builder()
                      .url(endpoint)
                      .header("X-API-Key", apiKey.trim())
                      .header("Accept", "application/json")
                      .post(body)
                      .build()

                  val call = http.newCall(request)

                  return suspendCancellableCoroutine { continuation ->
                      continuation.invokeOnCancellation { call.cancel() }

                      call.enqueue(object : Callback {
                          override fun onFailure(call: Call, e: IOException) {
                              if (continuation.isActive) {
                                  continuation.resumeWithException(e)
                              }
                          }

                          override fun onResponse(
                              call: Call,
                              response: Response
                          ) {
                              try {
                                  val results = response.use {
                                      if (!it.isSuccessful) {
                                          // Bound error-body reads as well.
                                          val detail = it.peekBody(1024)
                                              .string()
                                              .take(300)
                                          throw IOException(
                                              "HTTP ${it.code}: $detail"
                                          )
                                      }

                                      val responseBody = it.body
                                          ?: throw IOException("Empty response")

                                      JsonReader(
                                          responseBody.charStream()
                                      ).use { reader ->
                                          readResults(reader, call)
                                      }
                                  }

                                  if (continuation.isActive) {
                                      continuation.resumeWith(
                                          Result.success(results)
                                      )
                                  }
                              } catch (e: Exception) {
                                  if (continuation.isActive) {
                                      continuation.resumeWithException(e)
                                  }
                              }
                          }
                      })
                  }
              }

              private fun readText(
                  reader: JsonReader,
                  maximum: Int
              ): String = when (reader.peek()) {
                  JsonToken.STRING, JsonToken.NUMBER ->
                      reader.nextString().take(maximum)
                  else -> {
                      reader.skipValue()
                      ""
                  }
              }

              private fun readResults(
                  reader: JsonReader,
                  call: Call
              ): List {
                  if (reader.peek() != JsonToken.BEGIN_OBJECT) {
                      throw IOException("Expected a JSON response object")
                  }

                  // Keep memory bounded instead of retaining every result.
                  val best = mutableListOf()
                  var foundResults = false

                  reader.beginObject()
                  while (reader.hasNext()) {
                      if (call.isCanceled()) {
                          throw IOException("Search cancelled")
                      }

                      if (reader.nextName() != "results") {
                          reader.skipValue()
                          continue
                      }

                      if (reader.peek() != JsonToken.BEGIN_ARRAY) {
                          throw IOException("Response 'results' is not an array")
                      }

                      foundResults = true
                      reader.beginArray()

                      // Consume the entire array, including entries after 50.
                      while (reader.hasNext()) {
                          if (call.isCanceled()) {
                              throw IOException("Search cancelled")
                          }

                          if (reader.peek() != JsonToken.BEGIN_OBJECT) {
                              reader.skipValue()
                              continue
                          }

                          var sourceUrl = ""
                          var fallbackUrl = ""
                          var title = ""
                          var domain = ""
                          var score = 0.0

                          reader.beginObject()
                          while (reader.hasNext()) {
                              when (reader.nextName()) {
                                  "source_url" ->
                                      sourceUrl = readText(reader, 4096)
                                  "url" ->
                                      fallbackUrl = readText(reader, 4096)
                                  "title" ->
                                      title = readText(reader, 500)
                                  "domain" ->
                                      domain = readText(reader, 250)
                                  "score" ->
                                      score = readText(reader, 64)
                                          .toDoubleOrNull() ?: 0.0
                                  else -> reader.skipValue()
                              }
                          }
                          reader.endObject()

                          val address = sourceUrl.toHttpUrlOrNull()
                              ?: fallbackUrl.toHttpUrlOrNull()
                              ?: continue

                          val normalized = when {
                              !score.isFinite() -> 0.0
                              score > 1.0 -> score / 100.0
                              else -> score
                          }.coerceIn(0.0, 1.0).toFloat()

                          val profile = SocialProfile(
                              url = address.toString(),
                              score = normalized,
                              platform = detectPlatform(address.host),
                              title = title.ifBlank { domain }
                          )

                          val existing = best.indexOfFirst {
                              it.url == profile.url
                          }

                          if (existing >= 0) {
                              if (profile.score > best[existing].score) {
                                  best[existing] = profile
                              }
                          } else {
                              best.add(profile)
                          }

                          best.sortByDescending { it.score }
                          if (best.size > 50) {
                              best.removeAt(best.lastIndex)
                          }
                      }

                      reader.endArray()
                  }
                  reader.endObject()

                  if (!foundResults) {
                      throw IOException(
                          "Response has no 'results' array. Check the API endpoint."
                      )
                  }

                  return best.toList()
              }

              private fun detectPlatform(host: String): String {
                  val h = host.lowercase(Locale.ROOT)
                  fun matches(domain: String) =
                      h == domain || h.endsWith(".$domain")

                  return when {
                      matches("instagram.com") -> "Instagram"
                      matches("tiktok.com") -> "TikTok"
                      matches("facebook.com") || matches("fb.com") -> "Facebook"
                      matches("twitter.com") || matches("x.com") -> "X"
                      matches("linkedin.com") -> "LinkedIn"
                      matches("youtube.com") -> "YouTube"
                      matches("vk.com") -> "VK"
                      matches("ok.ru") -> "OK"
                      matches("pinterest.com") -> "Pinterest"
                      matches("t.me") || matches("telegram.org") -> "Telegram"
                      matches("reddit.com") -> "Reddit"
                      else -> "Web"
                  }
              }
          }

          fun profilesToJson(profiles: List): String =
              JSONArray().apply {
                  profiles.take(50).forEach { profile ->
                      put(JSONObject().apply {
                          put("url", profile.url)
                          put("score", profile.score.toDouble())
                          put("platform", profile.platform)
                          put("title", profile.title)
                          put("thumbnailUrl", JSONObject.NULL)
                      })
                  }
              }.toString()

          fun parseProfiles(json: String): List {
              val array = JSONArray(json)
              return buildList {
                  for (index in 0 until minOf(array.length(), 50)) {
                      val item = array.optJSONObject(index) ?: continue
                      val url = item.optString("url")
                          .toHttpUrlOrNull() ?: continue

                      val rawScore = item.optDouble("score", 0.0)
                      add(
                          SocialProfile(
                              url = url.toString(),
                              score = if (rawScore.isFinite()) {
                                  rawScore.coerceIn(0.0, 1.0).toFloat()
                              } else {
                                  0f
                              },
                              platform = item.optString("platform", "Web"),
                              title = item.optString("title", "")
                          )
                      )
                  }
              }.distinctBy { it.url }.sortedByDescending { it.score }
          }
