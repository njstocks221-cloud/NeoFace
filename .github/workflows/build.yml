          @Composable
          fun ResultsScreen(
              dao: SearchDao,
              id: Long,
              onBackToCamera: () -> Unit
          ) {

              val ctx =
                  LocalContext.current

              val scope =
                  rememberCoroutineScope()

              var record by
                  remember {
                      mutableStateOf<SearchRecord?>(
                          null
                      )
                  }

              var profiles by
                  remember {
                      mutableStateOf<
                          List<SocialProfile>
                          >(
                          emptyList()
                      )
                  }

              LaunchedEffect(
                  id
              ) {

                  val result =
                      withContext(
                          Dispatchers.IO
                      ) {
                          dao.get(id)
                      }

                  record =
                      result

                  if (
                      result != null
                  ) {

                      profiles =
                          withContext(
                              Dispatchers.Default
                          ) {

                              try {

                                  parseProfiles(
                                      result.resultsJson
                                  )

                              } catch (
                                  e: Exception
                              ) {

                                  Log.e(
                                      "NeoFace",
                                      "Results parsing failed",
                                      e
                                  )

                                  emptyList()
                              }
                          }
                  }
              }

              val rec =
                  record

              if (
                  rec == null
              ) {

                  Box(
                      Modifier
                          .fillMaxSize()
                          .background(
                              NeoBg
                          ),
                      contentAlignment =
                          Alignment.Center
                  ) {

                      CircularProgressIndicator(
                          color =
                              NeoCyan
                      )
                  }

                  return
              }

              Column(
                  Modifier
                      .fillMaxSize()
                      .background(
                          NeoBg
                      )
              ) {

                  Surface(
                      color =
                          NeoSurface,
                      modifier =
                          Modifier.fillMaxWidth()
                  ) {

                      Row(
                          Modifier.padding(
                              16.dp
                          ),
                          verticalAlignment =
                              Alignment.CenterVertically
                      ) {

                          val bmp by
                              produceState<Bitmap?>(
                                  initialValue =
                                      null,
                                  key1 =
                                      rec.id
                              ) {

                                  value =
                                      withContext(
                                          Dispatchers.IO
                                      ) {

                                          decodeFileScaled(
                                              rec.photoPath,
                                              200
                                          )
                                      }
                              }

                          if (
                              bmp != null
                          ) {

                              Image(
                                  bitmap =
                                      bmp!!
                                          .asImageBitmap(),
                                  contentDescription =
                                      null,
                                  modifier =
                                      Modifier
                                          .size(
                                              72.dp
                                          )
                                          .clip(
                                              CircleShape
                                          ),
                                  contentScale =
                                      ContentScale.Crop
                              )

                              Spacer(
                                  Modifier.width(
                                      16.dp
                                  )
                              )
                          }

                          Column(
                              Modifier.weight(
                                  1f
                              )
                          ) {

                              Text(
                                  "תוצאות חיפוש",
                                  color =
                                      NeoCyan,
                                  style =
                                      MaterialTheme
                                          .typography
                                          .titleLarge,
                                  fontWeight =
                                      FontWeight.Bold
                              )

                              Text(
                                  "${rec.resultCount} פרופילים נמצאו",
                                  color =
                                      if (
                                          rec.resultCount > 0
                                      ) {
                                          NeoGreen
                                      } else {
                                          NeoRed
                                      }
                              )

                              Text(
                                  SimpleDateFormat(
                                      "dd/MM/yyyy HH:mm",
                                      Locale.getDefault()
                                  ).format(
                                      Date(
                                          rec.timestamp
                                      )
                                  ),
                                  color =
                                      Color.Gray,
                                  style =
                                      MaterialTheme
                                          .typography
                                          .bodySmall
                              )
                          }

                          IconButton(

                              onClick = {

                                  scope.launch {

                                      withContext(
                                          Dispatchers.IO
                                      ) {
                                          dao.delete(
                                              rec
                                          )
                                      }

                                      onBackToCamera()
                                  }
                              }

                          ) {

                              Icon(
                                  Icons.Default.Delete,
                                  "מחק",
                                  tint =
                                      NeoRed
                              )
                          }
                      }
                  }

                  if (
                      rec.error != null
                  ) {

                      Surface(

                          Modifier
                              .fillMaxWidth()
                              .padding(
                                  16.dp
                              ),

                          color =
                              NeoRed.copy(
                                  alpha = 0.15f
                              ),

                          shape =
                              RoundedCornerShape(
                                  12.dp
                              )
                      ) {

                          Column(
                              Modifier.padding(
                                  16.dp
                              )
                          ) {

                              Text(
                                  "שגיאה בחיפוש",
                                  color =
                                      NeoRed,
                                  fontWeight =
                                      FontWeight.Bold
                              )

                              Spacer(
                                  Modifier.height(
                                      4.dp
                                  )
                              )

                              Text(
                                  rec.error,
                                  color =
                                      Color.White,
                                  style =
                                      MaterialTheme
                                          .typography
                                          .bodySmall
                              )
                          }
                      }
                  }

                  if (
                      profiles.isEmpty() &&
                      rec.error == null
                  ) {

                      Box(
                          Modifier
                              .weight(
                                  1f
                              )
                              .fillMaxWidth(),
                          contentAlignment =
                              Alignment.Center
                      ) {

                          Column(
                              horizontalAlignment =
                                  Alignment.CenterHorizontally,
                              modifier =
                                  Modifier.padding(
                                      32.dp
                                  )
                          ) {

                              Icon(
                                  Icons.Default.SearchOff,
                                  null,
                                  tint =
                                      NeoCyan,
                                  modifier =
                                      Modifier.size(
                                          72.dp
                                      )
                              )

                              Spacer(
                                  Modifier.height(
                                      16.dp
                                  )
                              )

                              Text(
                                  "לא נמצאו פרופילים",
                                  color =
                                      Color.White,
                                  style =
                                      MaterialTheme
                                          .typography
                                          .titleMedium
                              )

                              Text(
                                  "ייתכן שהאדם לא מופיע באופן ציבורי ברשת",
                                  color =
                                      Color.Gray,
                                  style =
                                      MaterialTheme
                                          .typography
                                          .bodySmall
                              )
                          }
                      }

                  } else {

                      LazyColumn(

                          Modifier
                              .weight(
                                  1f
                              )
                              .fillMaxWidth()
                              .padding(
                                  horizontal = 12.dp
                              )
                      ) {

                          items(
                              items = profiles,
                              key = {
                                  it.url
                              }
                          ) { profile ->

                              ProfileCard(
                                  profile
                              ) {

                                  openUrl(
                                      ctx,
                                      profile.url
                                  )
                              }
                          }

                          item {

                              Spacer(
                                  Modifier.height(
                                      16.dp
                                  )
                              )
                          }
                      }
                  }

                  Button(

                      onClick =
                          onBackToCamera,

                      modifier =
                          Modifier
                              .fillMaxWidth()
                              .padding(
                                  16.dp
