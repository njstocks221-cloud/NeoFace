          cat > app/src/main/java/com/neoface/AppRoot.kt << 'EOF'
          package com.neoface

          import androidx.compose.foundation.layout.padding
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.platform.LocalContext
          import androidx.navigation.NavType
          import androidx.navigation.compose.*
          import androidx.navigation.navArgument
          import com.neoface.data.AppDatabase
          import com.neoface.ui.*

          data class NavItem(val route: String, val label: String, val icon: ImageVector)

          @Composable
          fun AppRoot() {
              val ctx = LocalContext.current
              val db = remember { AppDatabase.get(ctx) }
              val dao = db.dao()
              val nav = rememberNavController()
              val backStack by nav.currentBackStackEntryAsState()
              val current = backStack?.destination?.route ?: "camera"

              val items = listOf(
                  NavItem("camera", "מצלמה", Icons.Default.CameraAlt),
                  NavItem("history", "היסטוריה", Icons.Default.History),
                  NavItem("settings", "הגדרות", Icons.Default.Settings)
              )

              Scaffold(
                  bottomBar = {
                      NavigationBar(containerColor = NeoSurface) {
                          items.forEach { it ->
                              val selected = current == it.route || current.startsWith("${it.route}/")
                              NavigationBarItem(
                                  selected = selected,
                                  onClick = {
                                      if (!selected) nav.navigate(it.route) {
                                          popUpTo("camera") { inclusive = false }
                                          launchSingleTop = true
                                      }
                                  },
                                  icon = { Icon(it.icon, it.label) },
                                  label = { Text(it.label) },
                                  colors = NavigationBarItemDefaults.colors(
                                      selectedIconColor = NeoCyan,
                                      selectedTextColor = NeoCyan,
                                      indicatorColor = NeoPurple
                                  )
                              )
                          }
                      }
                  }
              ) { pad ->
                  NavHost(nav, "camera", Modifier.padding(pad)) {
                      composable("camera") {
                          CameraScreen(dao) { id -> nav.navigate("results/$id") }
                      }
                      composable(
                          "results/{id}",
                          arguments = listOf(navArgument("id") { type = NavType.LongType })
                      ) { entry ->
                          val id = entry.arguments?.getLong("id") ?: 0L
                          ResultsScreen(dao, id) { nav.navigate("camera") }
                      }
                      composable("history") {
                          HistoryScreen(dao) { id -> nav.navigate("results/$id") }
                      }
                      composable("settings") { SettingsScreen() }
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/neoface/ui/CameraScreen.kt << 'EOF'
          package com.neoface.ui

          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.CameraAlt
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.core.content.FileProvider
          import com.neoface.*
          import com.neoface.data.SearchRecord
          import com.neoface.data.SearchDao
          import com.neoface.engine.SocialSearchClient
          import com.neoface.engine.savePhoto
          import com.neoface.engine.toJson
          import com.yalantis.ucrop.UCrop
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import java.io.File

          @Composable
          fun CameraScreen(dao: SearchDao, onComplete: (Long) -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var busy by remember { mutableStateOf(false) }
              var status by remember { mutableStateOf("") }

              val apiKey = Settings.getApiKey(ctx)
              val baseUrl = Settings.getBaseUrl(ctx)

              val uCropLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == android.app.Activity.RESULT_OK) {
                      val croppedUri = UCrop.getOutput(result.data!!)
                      if (croppedUri != null) {
                          busy = true
                          status = "שולח לחיפוש..."
                          scope.launch {
                              try {
                                  val inputStream = ctx.contentResolver.openInputStream(croppedUri)
                                  val bmp0 = BitmapFactory.decodeStream(inputStream)
                                  inputStream?.close()
                                  
                                  val bmp = normalize(bmp0)
                                  val localPath = savePhoto(ctx, bmp)
                                  val client = SocialSearchClient(apiKey = apiKey, baseUrl = baseUrl)
                                  val apiResult = client.search(bmp)
                                  val json = try {
                                      JSONArray().apply {
                                          apiResult.getOrNull()?.forEach { put(it.toJson()) }
                                      }.toString()
                                  } catch (e: Exception) { "[]" }
                                  
                                  val count = apiResult.getOrNull()?.size ?: 0
                                  val err = apiResult.exceptionOrNull()?.message
                                  val rec = SearchRecord(
                                      photoPath = localPath,
                                      resultsJson = json,
                                      resultCount = count,
                                      error = err
                                  )
                                  val id = withContext(Dispatchers.IO) {
                                      try { dao.insert(rec) } catch (e: Exception) { 0L }
                                  }
                                  withContext(Dispatchers.Main) {
                                      busy = false
                                      status = ""
                                      if (id > 0) onComplete(id)
                                  }
                              } catch (e: Exception) {
                                  busy = false
                                  status = "שגיאה בעיבוד התמונה: ${e.message}"
                              }
                          }
                      }
                  } else if (result.resultCode == UCrop.RESULT_ERROR) {
                      val cropError = UCrop.getError(result.data!!)
                      status = "שגיאה בחיתוך: ${cropError?.message}"
                  }
              }

              // GetContent is the safest way to get an image on Android 11-16
              val getContentLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.GetContent()
              ) { uri ->
                  if (uri != null) {
                      val cropDir = File(ctx.cacheDir, "cropped").apply { mkdirs() }
                      val destinationFile = File(cropDir, "cropped_${System.currentTimeMillis()}.jpg")
                      val destinationUri = FileProvider.getUriForFile(
                          ctx,
                          "${ctx.packageName}.fileprovider",
                          destinationFile
                      )
                      val uCropIntent = UCrop.of(uri, destinationUri)
                          .withAspectRatio(1f, 1f)
                          .withMaxResultSize(1024, 1024)
                          .getIntent(ctx)
                      uCropLauncher.launch(uCropIntent)
                  }
              }

              Box(Modifier.fillMaxSize().background(NeoBg)) {
                  Column(
                      Modifier.fillMaxSize().padding(32.dp),
                      verticalArrangement = Arrangement.Center,
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Text("מוכן לחיפוש פנים", color = NeoCyan, style = MaterialTheme.typography.headlineMedium)
                      Spacer(Modifier.height(16.dp))
                      Text(
                          "לחץ על הכפתור למטה, בחר 'מצלמה' או 'גלריה', וחתוך את הפנים",
                          color = Color.Gray, style = MaterialTheme.typography.bodyLarge, textAlign = TextAlign.Center
                      )
                      Spacer(Modifier.height(32.dp))

                      if (apiKey.isBlank()) {
                          Text("⚠️ חסר מפתח API. עבור להגדרות והזן מפתח.", color = NeoRed, style = MaterialTheme.typography.bodyMedium)
                          Spacer(Modifier.height(16.dp))
                      }

                      FloatingActionButton(
                          onClick = {
                              if (apiKey.isBlank()) return@FloatingActionButton
                              // Use GetContent to bypass FileProvider crashes on Android 16
                              getContentLauncher.launch("image/*")
                          },
                          modifier = Modifier.size(100.dp),
                          shape = CircleShape,
                          containerColor = NeoCyan
                      ) {
                          Icon(Icons.Default.CameraAlt, "בחר תמונה", tint = NeoBg, modifier = Modifier.size(48.dp))
                      }
                      Spacer(Modifier.height(16.dp))
                      Text("בחר תמונה", color = NeoCyan)
                  }

                  if (busy) {
                      Box(Modifier.fillMaxSize().background(Color.Black.copy(alpha = 0.7f))) {
                          Column(Modifier.align(Alignment.Center), horizontalAlignment = Alignment.CenterHorizontally) {
                              CircularProgressIndicator(color = NeoCyan)
                              Spacer(Modifier.height(16.dp))
                              Text(status, color = NeoCyan)
                          }
                      }
                  }
              }
          }

          private fun normalize(src: Bitmap?): Bitmap {
              if (src == null) return Bitmap.createBitmap(1, 1, Bitmap.Config.ARGB_8888)
              val maxDim = 1024
              if (src.width > src.height) {
                  if (src.width <= maxDim) return src
                  return Bitmap.createScaledBitmap(src, maxDim, src.height * maxDim / src.width, true)
              }
              if (src.height <= maxDim) return src
              return Bitmap.createScaledBitmap(src, src.width * maxDim / src.height, maxDim, true)
          }
          EOF

