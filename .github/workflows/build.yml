          @Composable
          fun CameraScreen(
              dao: SearchDao,
              onComplete: (Long) -> Unit
          ) {

              val ctx =
                  LocalContext.current

              val scope =
                  rememberCoroutineScope()

              var busy by
                  remember {
                      mutableStateOf(
                          false
                      )
                  }

              var status by
                  remember {
                      mutableStateOf(
                          ""
                      )
                  }

              var errorMessage by
                  remember {
                      mutableStateOf<String?>(
                          null
                      )
                  }

              val apiKey =
                  Settings.getApiKey(
                      ctx
                  )

              val baseUrl =
                  Settings.getBaseUrl(
                      ctx
                  )

              val getContentLauncher =
                  rememberLauncherForActivityResult(
                      contract =
                          ActivityResultContracts
                              .GetContent()
                  ) { uri ->

                      if (
                          uri != null
                      ) {

                          busy = true
                          status =
                              "מעבד תמונה..."

                          scope.launch {

                              try {

                                  val bmp =
                                      decodeUri(
                                          ctx,
                                          uri,
                                          1024
                                      )

                                  if (
                                      bmp == null
                                  ) {

                                      errorMessage =
                                          "לא ניתן לקרוא את התמונה. נסה שוב."

                                      busy =
                                          false

                                      return@launch
                                  }

                                  val localPath =
                                      savePhoto(
                                          ctx,
                                          bmp
                                      )

                                  status =
                                      "שולח לשרת (עד 5 דקות)..."

                                  val client =
                                      SocialSearchClient(
                                          apiKey =
                                              apiKey,
                                          baseUrl =
                                              baseUrl
                                      )

                                  val apiResult =
                                      client.search(
                                          bmp
                                      )

                                  val json =
                                      try {

                                          JSONArray()
                                              .apply {

                                                  apiResult
                                                      .getOrNull()
                                                      ?.forEach { profile ->

                                                          put(
                                                              profile.toJson()
                                                          )
                                                      }
                                              }
                                              .toString()

                                      } catch (_: Exception) {

                                          "[]"
                                      }

                                  val count =
                                      apiResult
                                          .getOrNull()
                                          ?.size
                                          ?: 0

                                  val err =
                                      apiResult
                                          .exceptionOrNull()
                                          ?.message

                                  val record =
                                      SearchRecord(
                                          photoPath =
                                              localPath,
                                          resultsJson =
                                              json,
                                          resultCount =
                                              count,
                                          error =
                                              err
                                      )

                                  val id =
                                      withContext(
                                          Dispatchers.IO
                                      ) {

                                          try {

                                              dao.insert(
                                                  record
                                              )

                                          } catch (
                                              e: Exception
                                          ) {

                                              0L
                                          }
                                      }

                                  withContext(
                                      Dispatchers.Main
                                  ) {

                                      busy =
                                          false

                                      status =
                                          ""

                                      if (
                                          id > 0
                                      ) {

                                          onComplete(
                                              id
                                          )

                                      } else {

                                          errorMessage =
                                              "שגיאה בשמירת הנתונים"
                                      }
                                  }

                              } catch (
                                  e: Exception
                              ) {

                                  busy =
                                      false

                                  errorMessage =
                                      "שגיאה: ${
                                          e.message
                                              ?: "שגיאה לא ידועה"
                                      }"
                              }
                          }
                      }
                  }

              Box(
                  Modifier
                      .fillMaxSize()
                      .background(
                          NeoBg
                      )
              ) {

                  Column(
                      Modifier
                          .fillMaxSize()
                          .padding(
                              32.dp
                          ),
                      verticalArrangement =
                          Arrangement.Center,
                      horizontalAlignment =
                          Alignment.CenterHorizontally
                  ) {

                      Text(
                          "NeoFace",
                          color =
                              NeoCyan,
                          style =
                              MaterialTheme
                                  .typography
                                  .headlineLarge,
                          fontWeight =
                              FontWeight.Bold
                      )

                      Spacer(
                          Modifier.height(
                              8.dp
                          )
                      )

                      Text(
                          "חיפוש פנים הפוך",
                          color =
                              Color.Gray,
                          style =
                              MaterialTheme
                                  .typography
                                  .bodyLarge
                      )

                      Spacer(
                          Modifier.height(
                              48.dp
                          )
                      )

                      if (
                          apiKey.isBlank()
                      ) {

                          Text(
                              "⚠️ חסר מפתח API. עבור להגדרות.",
                              color =
                                  NeoRed,
                              style =
                                  MaterialTheme
                                      .typography
                                      .bodyMedium
                          )

                          Spacer(
                              Modifier.height(
                                  16.dp
                              )
