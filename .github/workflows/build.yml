          cat > app/src/main/java/com/neoface/Settings.kt << 'EOF'
          package com.neoface

          import android.content.Context

          object Settings {
              private const val PREFS = "neoface_prefs"
              private const val KEY_API = "api_key"
              private const val KEY_URL = "base_url"

              const val DEFAULT_URL = "https://api.faceseek.online"

              fun getApiKey(ctx: Context): String =
                  ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY_API, "") ?: ""

              fun setApiKey(ctx: Context, key: String) =
                  ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString(KEY_API, key.trim()).apply()

              fun getBaseUrl(ctx: Context): String =
                  ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY_URL, DEFAULT_URL) ?: DEFAULT_URL

              fun setBaseUrl(ctx: Context, url: String) =
                  ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString(KEY_URL, url.trim()).apply()
          }
          EOF

          cat > app/src/main/java/com/neoface/data/SearchRecord.kt << 'EOF'
          package com.neoface.data

          import androidx.room.Entity
          import androidx.room.PrimaryKey

          @Entity(tableName = "searches")
          data class SearchRecord(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val photoPath: String,
              val timestamp: Long = System.currentTimeMillis(),
              val resultsJson: String,
              val resultCount: Int = 0,
              val error: String? = null
          )
          EOF

          cat > app/src/main/java/com/neoface/data/SearchDao.kt << 'EOF'
          package com.neoface.data

          import androidx.room.*
          import kotlinx.coroutines.flow.Flow

          @Dao
          interface SearchDao {
              @Insert suspend fun insert(s: SearchRecord): Long
              @Query("SELECT * FROM searches ORDER BY timestamp DESC") fun all(): Flow<List<SearchRecord>>
              @Query("SELECT * FROM searches WHERE id = :id") suspend fun get(id: Long): SearchRecord?
              @Query("SELECT * FROM searches WHERE id = :id") fun observe(id: Long): Flow<SearchRecord?>
              @Delete suspend fun delete(s: SearchRecord)
              @Query("DELETE FROM searches") suspend fun clear()
          }
          EOF

          cat > app/src/main/java/com/neoface/data/AppDatabase.kt << 'EOF'
          package com.neoface.data

          import android.content.Context
          import androidx.room.Database
          import androidx.room.Room
          import androidx.room.RoomDatabase

          @Database(entities = [SearchRecord::class], version = 1, exportSchema = false)
          abstract class AppDatabase : RoomDatabase() {
              abstract fun dao(): SearchDao
              companion object {
                  @Volatile private var instance: AppDatabase? = null
                  fun get(ctx: Context): AppDatabase = instance ?: synchronized(this) {
                      instance ?: Room.databaseBuilder(
                          ctx.applicationContext, AppDatabase::class.java, "neoface.db"
                      ).build().also { instance = it }
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/neoface/engine/ImageUtils.kt << 'EOF'
          package com.neoface.engine

          import android.content.Context
          import android.graphics.*
          import android.net.Uri
          import java.io.File

          fun savePhoto(ctx: Context, bmp: Bitmap): String {
              val dir = File(ctx.filesDir, "photos").apply { mkdirs() }
              val file = File(dir, "face_${System.currentTimeMillis()}.jpg")
              file.outputStream().use { bmp.compress(Bitmap.CompressFormat.JPEG, 90, it) }
              return file.absolutePath
          }

          fun decodeUri(ctx: Context, uri: Uri, maxDim: Int = 1024): Bitmap? {
              return try {
                  val options = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  ctx.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, options) }
                  
                  var inSampleSize = 1
                  val (width, height) = options.outWidth to options.outHeight
                  if (width > maxDim || height > maxDim) {
                      val halfHeight = height / 2
                      val halfWidth = width / 2
                      while ((halfHeight / inSampleSize) >= maxDim && (halfWidth / inSampleSize) >= maxDim) {
                          inSampleSize *= 2
                      }
                  }
                  options.inJustDecodeBounds = false
                  options.inSampleSize = inSampleSize
                  
                  ctx.contentResolver.openInputStream(uri)?.use { 
                      BitmapFactory.decodeStream(it, null, options) 
                  }
              } catch (e: Exception) {
                  null
              }
          }

          fun decodeFileScaled(path: String, maxDim: Int = 512): Bitmap? {
              return try {
                  val options = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeFile(path, options)
                  
                  var inSampleSize = 1
                  val (width, height) = options.outWidth to options.outHeight
                  if (width > maxDim || height > maxDim) {
                      val halfHeight = height / 2
                      val halfWidth = width / 2
                      while ((halfHeight / inSampleSize) >= maxDim && (halfWidth / inSampleSize) >= maxDim) {
                          inSampleSize *= 2
                      }
                  }
                  options.inJustDecodeBounds = false
                  options.inSampleSize = inSampleSize
                  BitmapFactory.decodeFile(path, options)
              } catch (e: Exception) {
                  null
              }
          }
          EOF

          cat > app/src/main/java/com/neoface/engine/SocialSearchClient.kt << 'EOF'
          package com.neoface.engine

          import android.graphics.Bitmap
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.*
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.util.concurrent.TimeUnit

          data class SocialProfile(
              val url: String,
              val score: Float,
              val thumbnailUrl: String? = null,
              val platform: String = "",
              val title: String = ""
          )

          class SocialSearchClient(
              private val apiKey: String,
              private val baseUrl: String
          ) {
              private val http = OkHttpClient.Builder()
                  .connectTimeout(60, TimeUnit.SECONDS)
                  .readTimeout(300, TimeUnit.SECONDS)
                  .writeTimeout(300, TimeUnit.SECONDS)
                  .build()

              suspend fun search(bitmap: Bitmap): Result<List<SocialProfile>> = withContext(Dispatchers.IO) {
                  try {
                      if (apiKey.isBlank()) return@withContext Result.failure(Exception("חסר מפתח API — הזן בהגדרות"))
                      val jpeg = ByteArrayOutputStream().use { out ->
                          bitmap.compress(Bitmap.CompressFormat.JPEG, 85, out)
                          out.toByteArray()
                      }
                      
                      val imgBody = jpeg.toRequestBody("image/jpeg".toMediaType())
                      
                      val multipart = MultipartBody.Builder()
                          .setType(MultipartBody.FORM)
                          .addFormDataPart("file", "face.jpg", imgBody)
                          .build()

                      val url = baseUrl.trimEnd('/') + "/v1/api/search"
                      
                      val req = Request.Builder()
                          .url(url)
                          .header("X-API-Key", apiKey)
                          .header("Accept", "application/json")
                          .post(multipart)
                          .build()

                      http.newCall(req).execute().use { resp ->
                          // הגנה קריטית: קריאת התשובה עלולה לקרוס בגלל זיכרון אם יש Base64
                          val body = try {
                              resp.body?.string() ?: ""
                          } catch (e: OutOfMemoryError) {
                              return@withContext Result.failure(Exception("התשובה מהשרת גדולה מדי (מכילה תמונות Base64). השרת החזיר יותר מדי נתונים."))
                          }
                          
                          if (!resp.isSuccessful) {
                              return@withContext Result.failure(Exception("HTTP ${resp.code}: ${body.take(250)}"))
                          }
                          Result.success(parse(body))
                      }
                  } catch (e: Exception) {
                      Result.failure(e)
                  }
              }

              private fun parse(json: String): List<SocialProfile> {
                  val list = mutableListOf<SocialProfile>()
                  try {
                      val o = JSONObject(json)
                      val arr = o.optJSONArray("results") ?: JSONArray()
                      
                      for (i in 0 until arr.length()) {
                          if (list.size >= 50) break
                          
                          val item = arr.getJSONObject(i)
                          val u = item.optString("source_url", item.optString("url", ""))
                          if (u.isBlank()) continue
                          
                          val s = item.optDouble("score", 0.0).toFloat()
                          val normalizedScore = if (s > 1.0f) s / 100f else s
                          
                          val title = item.optString("title", item.optString("domain", ""))
                          list.add(SocialProfile(u, normalizedScore, null, detect(u), title))
                      }
                  } catch (_: Exception) {}
                  // החזרת רשימה ללא כפילויות
                  return list.sortedByDescending { it.score }.distinctBy { it.url }
              }

              private fun detect(url: String): String = when {
                  url.contains("instagram.com") -> "Instagram"
                  url.contains("tiktok.com") -> "TikTok"
                  url.contains("facebook.com") || url.contains("fb.com") -> "Facebook"
                  url.contains("twitter.com") || url.contains("x.com") -> "X"
                  url.contains("linkedin.com") -> "LinkedIn"
                  url.contains("youtube.com") -> "YouTube"
                  url.contains("vk.com") -> "VK"
                  url.contains("ok.ru") -> "OK"
                  url.contains("pinterest.com") -> "Pinterest"
                  url.contains("t.me") || url.contains("telegram") -> "Telegram"
                  url.contains("reddit.com") -> "Reddit"
                  else -> "Web"
              }
          }

          fun SocialProfile.toJson(): JSONObject = JSONObject().apply {
              put("url", url); put("score", score)
              put("thumbnailUrl", thumbnailUrl ?: JSONObject.NULL)
              put("platform", platform); put("title", title)
          }

          fun parseProfiles(json: String): List<SocialProfile> {
              val list = mutableListOf<SocialProfile>()
              try {
                  val arr = JSONArray(json)
                  for (i in 0 until arr.length()) {
                      if (list.size >= 50) break
                      val o = arr.getJSONObject(i)
                      list.add(SocialProfile(
                          url = o.getString("url"),
                          score = o.optDouble("score", 0.0).toFloat(),
                          thumbnailUrl = if (o.isNull("thumbnailUrl")) null else o.optString("thumbnailUrl"),
                          platform = o.optString("platform", "Web"),
                          title = o.optString("title", "")
                      ))
                  }
              } catch (_: Exception) {}
              // החזרת רשימה ללא כפילויות
              return list.sortedByDescending { it.score }.distinctBy { it.url }
          }
          EOF

