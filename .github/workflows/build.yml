name: Build NeoFace APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Generate project
        shell: bash
        run: |
          # This workflow generates the entire app.
          # Remove old generated sources so they cannot conflict.
          rm -rf app
          mkdir -p app/src/main/java/com/neoface
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NeoFace"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
              id 'org.jetbrains.kotlin.kapt' version '1.9.20' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'org.jetbrains.kotlin.kapt'
          }

          android {
              namespace 'com.neoface'
              compileSdk 34

              defaultConfig {
                  applicationId "com.neoface"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.1"
              }

              buildFeatures {
                  compose true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.4'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              packaging {
                  resources {
                      excludes += [
                          'META-INF/AL2.0',
                          'META-INF/LGPL2.1'
                      ]
                  }
              }
          }

          dependencies {
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.foundation:foundation'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'

              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
              implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
              implementation 'androidx.exifinterface:exifinterface:1.3.7'

              implementation 'androidx.room:room-runtime:2.6.1'
              implementation 'androidx.room:room-ktx:2.6.1'
              kapt 'androidx.room:room-compiler:2.6.1'

              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="NeoFace"
                  android:icon="@drawable/ic_neo_logo"
                  android:roundIcon="@drawable/ic_neo_logo"
                  android:theme="@style/Theme.NeoFace"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.NeoFace" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#0A0E27</item>
                  <item name="android:navigationBarColor">#0A0E27</item>
                  <item name="android:windowBackground">#0A0E27</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <string name="app_name">NeoFace</string>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_neo_logo.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0A0E27"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#7C4DFF"
                  android:strokeWidth="3"
                  android:pathData="M54,14 A40,40 0 1,1 53.99,14 Z" />
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#00E5FF"
                  android:strokeWidth="6"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round"
                  android:pathData="M36,76 L36,32 L72,76 L72,32" />
          </vector>
          EOF

          cat > app/src/main/java/com/neoface/Data.kt <<'EOF'
          package com.neoface

          import android.content.Context
          import androidx.room.*
          import kotlinx.coroutines.flow.Flow

          @Entity(tableName = "searches")
          data class SearchRecord(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val photoPath: String,
              val timestamp: Long = System.currentTimeMillis(),
              val resultsJson: String,
              val resultCount: Int = 0,
              val error: String? = null
          )

          @Dao
          interface SearchDao {
              @Insert
              suspend fun insert(record: SearchRecord): Long

              @Query("SELECT * FROM searches ORDER BY timestamp DESC")
              fun all(): Flow<List<SearchRecord>>

              @Delete
              suspend fun delete(record: SearchRecord)
          }

          @Database(
              entities = [SearchRecord::class],
              version = 1,
              exportSchema = false
          )
          abstract class AppDatabase : RoomDatabase() {
              abstract fun dao(): SearchDao

              companion object {
                  @Volatile
                  private var instance: AppDatabase? = null

                  fun get(context: Context): AppDatabase =
                      instance ?: synchronized(this) {
                          instance ?: Room.databaseBuilder(
                              context.applicationContext,
                              AppDatabase::class.java,
                              "neoface.db"
                          ).build().also { instance = it }
                      }
              }
          }

          object Settings {
              const val DEFAULT_URL = "https://api.faceseek.online"

              private fun prefs(context: Context) =
                  context.getSharedPreferences(
                      "neoface_prefs",
                      Context.MODE_PRIVATE
                  )

              fun apiKey(context: Context): String =
                  prefs(context).getString("api_key", "") ?: ""

              fun baseUrl(context: Context): String =
                  prefs(context).getString("base_url", DEFAULT_URL)
                      ?: DEFAULT_URL

              fun save(context: Context, key: String, url: String) {
                  prefs(context).edit()
                      .putString("api_key", key.trim())
                      .putString("base_url", url.trim().trimEnd('/'))
                      .apply()
              }
          }
          EOF

          cat > app/src/main/java/com/neoface/Images.kt <<'EOF'
          package com.neoface

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Matrix
          import android.net.Uri
          import androidx.exifinterface.media.ExifInterface
          import java.io.File
          import java.io.IOException
          import java.util.UUID

          private fun decodeOptions(
              bounds: BitmapFactory.Options,
              maxDimension: Int
          ): BitmapFactory.Options {
              require(maxDimension > 0)

              if (bounds.outWidth <= 0 || bounds.outHeight <= 0) {
                  throw IOException("Unsupported or damaged image")
              }

              var sample = 1
              while (
                  bounds.outWidth / sample > maxDimension ||
                  bounds.outHeight / sample > maxDimension
              ) {
                  sample *= 2
              }

              return BitmapFactory.Options().apply {
                  inSampleSize = sample
                  inPreferredConfig = Bitmap.Config.ARGB_8888
              }
          }

          fun decodeUri(context: Context, uri: Uri): Bitmap {
              val resolver = context.contentResolver
              val bounds = BitmapFactory.Options().apply {
                  inJustDecodeBounds = true
              }

              (resolver.openInputStream(uri)
                  ?: throw IOException("Cannot open image")).use {
                  BitmapFactory.decodeStream(it, null, bounds)
              }

              val options = decodeOptions(bounds, 512)
              val bitmap = (resolver.openInputStream(uri)
                  ?: throw IOException("Cannot reopen image")).use {
                  BitmapFactory.decodeStream(it, null, options)
              } ?: throw IOException("Cannot decode image")

              val orientation = try {
                  resolver.openInputStream(uri)?.use {
                      ExifInterface(it).getAttributeInt(
                          ExifInterface.TAG_ORIENTATION,
                          ExifInterface.ORIENTATION_NORMAL
                      )
                  } ?: ExifInterface.ORIENTATION_NORMAL
              } catch (_: IOException) {
                  ExifInterface.ORIENTATION_NORMAL
              }

              val matrix = Matrix()
              when (orientation) {
                  ExifInterface.ORIENTATION_FLIP_HORIZONTAL ->
                      matrix.setScale(-1f, 1f)
                  ExifInterface.ORIENTATION_ROTATE_180 ->
                      matrix.setRotate(180f)
                  ExifInterface.ORIENTATION_FLIP_VERTICAL ->
                      matrix.setScale(1f, -1f)
                  ExifInterface.ORIENTATION_TRANSPOSE -> {
                      matrix.setRotate(90f)
                      matrix.postScale(-1f, 1f)
                  }
                  ExifInterface.ORIENTATION_ROTATE_90 ->
                      matrix.setRotate(90f)
                  ExifInterface.ORIENTATION_TRANSVERSE -> {
                      matrix.setRotate(-90f)
                      matrix.postScale(-1f, 1f)
                  }
                  ExifInterface.ORIENTATION_ROTATE_270 ->
                      matrix.setRotate(-90f)
              }

              if (matrix.isIdentity) return bitmap

              return try {
                  Bitmap.createBitmap(
                      bitmap, 0, 0, bitmap.width, bitmap.height,
                      matrix, true
                  ).also {
                      if (it !== bitmap) bitmap.recycle()
                  }
              } catch (e: Exception) {
                  bitmap.recycle()
                  throw e
              }
          }

          fun savePhoto(context: Context, bitmap: Bitmap): File {
              val directory = File(context.filesDir, "photos")
              if (!directory.exists() && !directory.mkdirs()) {
                  throw IOException("Cannot create photo directory")
              }

              val file = File(directory, "face_${UUID.randomUUID()}.jpg")
              try {
                  file.outputStream().use {
                      if (!bitmap.compress(Bitmap.CompressFormat.JPEG, 85, it)) {
                          throw IOException("Cannot save image")
                      }
                  }
                  return file
              } catch (e: Exception) {
                  file.delete()
                  throw e
              }
          }

          fun decodeThumbnail(path: String): Bitmap? = try {
              val bounds = BitmapFactory.Options().apply {
                  inJustDecodeBounds = true
              }
              BitmapFactory.decodeFile(path, bounds)
              BitmapFactory.decodeFile(path, decodeOptions(bounds, 200))
          } catch (_: Exception) {
              null
          }
          EOF

          cat > app/src/main/java/com/neoface/SearchClient.kt <<'EOF'
          package com.neoface

          import com.google.gson.stream.JsonReader
          import com.google.gson.stream.JsonToken
          import kotlinx.coroutines.suspendCancellableCoroutine
          import okhttp3.*
          import okhttp3.HttpUrl.Companion.toHttpUrlOrNull
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.RequestBody.Companion.asRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.IOException
          import java.util.Locale
          import java.util.concurrent.TimeUnit
          import kotlin.coroutines.resumeWithException

          data class SocialProfile(
              val url: String,
              val score: Float,
              val platform: String,
              val title: String
          )

          object SearchClient {
              private val http = OkHttpClient.Builder()
                  .connectTimeout(45, TimeUnit.SECONDS)
                  .readTimeout(300, TimeUnit.SECONDS)
                  .writeTimeout(120, TimeUnit.SECONDS)
                  .callTimeout(330, TimeUnit.SECONDS)
                  .followRedirects(false)
                  .followSslRedirects(false)
                  .build()

              suspend fun search(
                  photo: File,
                  apiKey: String,
                  baseUrl: String
              ): List<SocialProfile> {
                  require(apiKey.isNotBlank()) { "Missing API key" }

                  val base = baseUrl.trim().toHttpUrlOrNull()
                      ?: throw IOException("Invalid server URL")

                  require(base.isHttps) { "Server URL must use HTTPS" }
                  require(base.username.isEmpty() && base.password.isEmpty()) {
                      "Server URL must not contain credentials"
                  }

                  val endpoint = base.newBuilder()
                      .query(null)
                      .fragment(null)
                      .encodedPath(
                          base.encodedPath.trimEnd('/') + "/v1/api/search"
                      )
                      .build()

                  val body = MultipartBody.Builder()
                      .setType(MultipartBody.FORM)
                      .addFormDataPart(
                          "file",
                          "face.jpg",
                          photo.asRequestBody("image/jpeg".toMediaType())
                      )
                      .build()

                  val request = Request.Builder()
                      .url(endpoint)
                      .header("X-API-Key", apiKey.trim())
                      .header("Accept", "application/json")
                      .post(body)
                      .build()

                  val call = http.newCall(request)

                  return suspendCancellableCoroutine { continuation ->
                      continuation.invokeOnCancellation { call.cancel() }

                      call.enqueue(object : Callback {
                          override fun onFailure(call: Call, e: IOException) {
                              if (continuation.isActive) {
                                  continuation.resumeWithException(e)
                              }
                          }

                          override fun onResponse(
                              call: Call,
                              response: Response
                          ) {
                              try {
                                  val results = response.use {
                                      if (!it.isSuccessful) {
                                          // Bound error-body reads as well.
                                          val detail = it.peekBody(1024)
                                              .string()
                                              .take(300)
                                          throw IOException(
                                              "HTTP ${it.code}: $detail"
                                          )
                                      }

                                      val responseBody = it.body
                                          ?: throw IOException("Empty response")

                                      JsonReader(
                                          responseBody.charStream()
                                      ).use { reader ->
                                          readResults(reader, call)
                                      }
                                  }

                                  if (continuation.isActive) {
                                      continuation.resumeWith(
                                          Result.success(results)
                                      )
                                  }
                              } catch (e: Exception) {
                                  if (continuation.isActive) {
                                      continuation.resumeWithException(e)
                                  }
                              }
                          }
                      })
                  }
              }

              private fun readText(
                  reader: JsonReader,
                  maximum: Int
              ): String = when (reader.peek()) {
                  JsonToken.STRING, JsonToken.NUMBER ->
                      reader.nextString().take(maximum)
                  else -> {
                      reader.skipValue()
                      ""
                  }
              }

              private fun readResults(
                  reader: JsonReader,
                  call: Call
              ): List<SocialProfile> {
                  if (reader.peek() != JsonToken.BEGIN_OBJECT) {
                      throw IOException("Expected a JSON response object")
                  }

                  // Keep memory bounded instead of retaining every result.
                  val best = mutableListOf<SocialProfile>()
                  var foundResults = false

                  reader.beginObject()
                  while (reader.hasNext()) {
                      if (call.isCanceled()) {
                          throw IOException("Search cancelled")
                      }

                      if (reader.nextName() != "results") {
                          reader.skipValue()
                          continue
                      }

                      if (reader.peek() != JsonToken.BEGIN_ARRAY) {
                          throw IOException("Response 'results' is not an array")
                      }

                      foundResults = true
                      reader.beginArray()

                      // Consume the entire array, including entries after 50.
                      while (reader.hasNext()) {
                          if (call.isCanceled()) {
                              throw IOException("Search cancelled")
                          }

                          if (reader.peek() != JsonToken.BEGIN_OBJECT) {
                              reader.skipValue()
                              continue
                          }

                          var sourceUrl = ""
                          var fallbackUrl = ""
                          var title = ""
                          var domain = ""
                          var score = 0.0

                          reader.beginObject()
                          while (reader.hasNext()) {
                              when (reader.nextName()) {
                                  "source_url" ->
                                      sourceUrl = readText(reader, 4096)
                                  "url" ->
                                      fallbackUrl = readText(reader, 4096)
                                  "title" ->
                                      title = readText(reader, 500)
                                  "domain" ->
                                      domain = readText(reader, 250)
                                  "score" ->
                                      score = readText(reader, 64)
                                          .toDoubleOrNull() ?: 0.0
                                  else -> reader.skipValue()
                              }
                          }
                          reader.endObject()

                          val address = sourceUrl.toHttpUrlOrNull()
                              ?: fallbackUrl.toHttpUrlOrNull()
                              ?: continue

                          val normalized = when {
                              !score.isFinite() -> 0.0
                              score > 1.0 -> score / 100.0
                              else -> score
                          }.coerceIn(0.0, 1.0).toFloat()

                          val profile = SocialProfile(
                              url = address.toString(),
                              score = normalized,
                              platform = detectPlatform(address.host),
                              title = title.ifBlank { domain }
                          )

                          val existing = best.indexOfFirst {
                              it.url == profile.url
                          }

                          if (existing >= 0) {
                              if (profile.score > best[existing].score) {
                                  best[existing] = profile
                              }
                          } else {
                              best.add(profile)
                          }

                          best.sortByDescending { it.score }
                          if (best.size > 50) {
                              best.removeAt(best.lastIndex)
                          }
                      }

                      reader.endArray()
                  }
                  reader.endObject()

                  if (!foundResults) {
                      throw IOException(
                          "Response has no 'results' array. Check the API endpoint."
                      )
                  }

                  return best.toList()
              }

              private fun detectPlatform(host: String): String {
                  val h = host.lowercase(Locale.ROOT)
                  fun matches(domain: String) =
                      h == domain || h.endsWith(".$domain")

                  return when {
                      matches("instagram.com") -> "Instagram"
                      matches("tiktok.com") -> "TikTok"
                      matches("facebook.com") || matches("fb.com") -> "Facebook"
                      matches("twitter.com") || matches("x.com") -> "X"
                      matches("linkedin.com") -> "LinkedIn"
                      matches("youtube.com") -> "YouTube"
                      matches("vk.com") -> "VK"
                      matches("ok.ru") -> "OK"
                      matches("pinterest.com") -> "Pinterest"
                      matches("t.me") || matches("telegram.org") -> "Telegram"
                      matches("reddit.com") -> "Reddit"
                      else -> "Web"
                  }
              }
          }

          fun profilesToJson(profiles: List<SocialProfile>): String =
              JSONArray().apply {
                  profiles.take(50).forEach { profile ->
                      put(JSONObject().apply {
                          put("url", profile.url)
                          put("score", profile.score.toDouble())
                          put("platform", profile.platform)
                          put("title", profile.title)
                          put("thumbnailUrl", JSONObject.NULL)
                      })
                  }
              }.toString()

          fun parseProfiles(json: String): List<SocialProfile> {
              val array = JSONArray(json)
              return buildList {
                  for (index in 0 until minOf(array.length(), 50)) {
                      val item = array.optJSONObject(index) ?: continue
                      val url = item.optString("url")
                          .toHttpUrlOrNull() ?: continue

                      val rawScore = item.optDouble("score", 0.0)
                      add(
                          SocialProfile(
                              url = url.toString(),
                              score = if (rawScore.isFinite()) {
                                  rawScore.coerceIn(0.0, 1.0).toFloat()
                              } else {
                                  0f
                              },
                              platform = item.optString("platform", "Web"),
                              title = item.optString("title", "")
                          )
                      )
                  }
              }.distinctBy { it.url }.sortedByDescending { it.score }
          }
          EOF

          cat > app/src/main/java/com/neoface/NeoViewModel.kt <<'EOF'
          package com.neoface

          import android.app.Application
          import android.net.Uri
          import android.util.Log
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.NonCancellable
          import kotlinx.coroutines.flow.*
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File

          class NeoViewModel(application: Application) :
              AndroidViewModel(application) {

              private val context = application.applicationContext
              private val dao = AppDatabase.get(context).dao()

              private val _busy = MutableStateFlow(false)
              val busy = _busy.asStateFlow()

              private val _status = MutableStateFlow("")
              val status = _status.asStateFlow()

              private val _error = MutableStateFlow<String?>(null)
              val error = _error.asStateFlow()

              private val _selected = MutableStateFlow<SearchRecord?>(null)
              val selected = _selected.asStateFlow()

              private var searchJob: Job? = null

              val history: StateFlow<List<SearchRecord>> = dao.all()
                  .catch { e ->
                      if (e is CancellationException) throw e
                      report(e)
                      emit(emptyList())
                  }
                  .stateIn(
                      viewModelScope,
                      SharingStarted.WhileSubscribed(5000),
                      emptyList()
                  )

              fun clearError() {
                  _error.value = null
              }

              fun showError(message: String) {
                  _error.value = message
              }

              fun open(record: SearchRecord) {
                  _selected.value = record
              }

              fun closeResults() {
                  _selected.value = null
              }

              fun cancelSearch() {
                  searchJob?.cancel()
              }

              fun search(uri: Uri) {
                  if (_busy.value) return

                  val key = Settings.apiKey(context)
                  val url = Settings.baseUrl(context)

                  if (key.isBlank()) {
                      showError("יש להזין מפתח API בהגדרות")
                      return
                  }

                  _busy.value = true
                  _status.value = "מעבד תמונה..."
                  _error.value = null

                  searchJob = viewModelScope.launch {
                      var photo: File? = null
                      var saved = false

                      try {
                          val record = withContext(Dispatchers.IO) {
                              val bitmap = decodeUri(context, uri)

                              val file = try {
                                  savePhoto(context, bitmap).also { photo = it }
                              } finally {
                                  bitmap.recycle()
                              }

                              _status.value = "שולח לשרת..."
                              var apiError: String? = null

                              val profiles = try {
                                  SearchClient.search(file, key, url)
                              } catch (e: CancellationException) {
                                  throw e
                              } catch (e: Exception) {
                                  Log.e("NeoFace", "Search failed", e)
                                  apiError = e.message ?: "Search failed"
                                  emptyList()
                              }

                              _status.value = "שומר תוצאות..."

                              val newRecord = SearchRecord(
                                  photoPath = file.absolutePath,
                                  resultsJson = profilesToJson(profiles),
                                  resultCount = profiles.size,
                                  error = apiError
                              )

                              // Let an insert finish atomically with respect
                              // to cancellation before cleaning up its photo.
                              withContext(NonCancellable) {
                                  val id = dao.insert(newRecord)
                                  saved = true
                                  newRecord.copy(id = id)
                              }
                          }

                          _selected.value = record
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          report(e)
                      } finally {
                          if (!saved) {
                              withContext(NonCancellable + Dispatchers.IO) {
                                  photo?.delete()
                              }
                          }
                          _busy.value = false
                          _status.value = ""
                      }
                  }
              }

              fun delete(record: SearchRecord) {
                  viewModelScope.launch {
                      try {
                          withContext(Dispatchers.IO) {
                              dao.delete(record)
                              File(record.photoPath).delete()
                          }
                          if (_selected.value?.id == record.id) {
                              _selected.value = null
                          }
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          report(e)
                      }
                  }
              }

              private fun report(e: Throwable) {
                  Log.e("NeoFace", "Operation failed", e)
                  _error.value = e.message ?: "Operation failed"
              }
          }
