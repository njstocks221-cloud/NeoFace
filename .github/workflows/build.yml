My previous version introduced errors, including a missing Image import and a parser that failed when more than 50 results arrived. This replacement fixes those issues, preserves your original Room history database and settings, and clears old generated source files to avoid conflicts.

Replace all of .github/workflows/build.yml with this block. I haven’t compiled it here, and GitHub’s “File could not be edited” message is a separate saving issue.

