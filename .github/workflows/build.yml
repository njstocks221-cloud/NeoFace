          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.neoface.NeoBg
          import com.neoface.NeoCyan
          import com.neoface.NeoGreen
          import com.neoface.NeoPurple
          import com.neoface.NeoRed
          import com.neoface.NeoSurface
          import com.neoface.data.SearchDao
          import com.neoface.engine.SocialProfile
          import com.neoface.engine.decodeFileScaled
          import com.neoface.engine.parseProfiles
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.text.SimpleDateFormat
          import java.util.*

          @Composable
          fun ResultsScreen(dao: SearchDao, id: Long, onBackToCamera: () -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var record by remember { mutableStateOf<com.neoface.data.SearchRecord?>(null) }
              var profiles by remember { mutableStateOf<List<SocialProfile>>(emptyList()) }

              LaunchedEffect(id) {
                  val r = withContext(Dispatchers.IO) { dao.get(id) }
                  record = r
                  if (r != null) {
                      profiles = withContext(Dispatchers.Default) {
                          try { parseProfiles(r.resultsJson) } catch (e: Exception) { emptyList() }
                      }
                  }
              }

              val rec = record
              Column(Modifier.fillMaxSize().background(NeoBg)) {
                  if (rec == null) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          CircularProgressIndicator(color = NeoCyan)
                      }
                      return@Column
                  }

                  Surface(color = NeoSurface, modifier = Modifier.fillMaxWidth()) {
                      Row(Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                          // טעינת התמונה ברקע כדי למנוע קריסה
                          val bmp by produceState<Bitmap?>(initialValue = null, key1 = rec.id) {
                              value = withContext(Dispatchers.IO) { decodeFileScaled(rec.photoPath, 200) }
                          }
                          if (bmp != null) {
                              Image(
                                  bmp!!.asImageBitmap(), null,
                                  modifier = Modifier.size(72.dp).clip(CircleShape),
                                  contentScale = ContentScale.Crop
                              )
                              Spacer(Modifier.width(16.dp))
                          }
                          Column(Modifier.weight(1f)) {
                              Text("תוצאות חיפוש", color = NeoCyan,
                                  style = MaterialTheme.typography.titleLarge,
                                  fontWeight = FontWeight.Bold)
                              Text(
                                  "${rec.resultCount} פרופילים נמצאו",
                                  color = if (rec.resultCount > 0) NeoGreen else NeoRed
                              )
                              Text(
                                  SimpleDateFormat("dd/MM/yyyy HH:mm", Locale.getDefault())
                                      .format(Date(rec.timestamp)),
                                  color = Color.Gray,
                                  style = MaterialTheme.typography.bodySmall
                              )
                          }
                          IconButton(onClick = {
                              scope.launch { withContext(Dispatchers.IO) { dao.delete(rec) }; onBackToCamera() }
                          }) { Icon(Icons.Default.Delete, "מחק", tint = NeoRed) }
                      }
                  }

                  if (rec.error != null) {
                      Surface(
                          Modifier.fillMaxWidth().padding(16.dp),
                          color = NeoRed.copy(alpha = 0.15f),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Column(Modifier.padding(16.dp)) {
                              Text("שגיאה בחיפוש", color = NeoRed, fontWeight = FontWeight.Bold)
                              Spacer(Modifier.height(4.dp))
                              Text(rec.error, color = Color.White, style = MaterialTheme.typography.bodySmall)
                          }
                      }
                  }

                  if (profiles.isEmpty() && rec.error == null) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally,
                              modifier = Modifier.padding(32.dp)) {
                              Icon(Icons.Default.SearchOff, null,
                                  tint = NeoCyan, modifier = Modifier.size(72.dp))
                              Spacer(Modifier.height(16.dp))
                              Text("לא נמצאו פרופילים", color = Color.White,
                                  style = MaterialTheme.typography.titleMedium)
                              Text("ייתכן שהאדם לא מופיע באופן ציבורי ברשת",
                                  color = Color.Gray, style = MaterialTheme.typography.bodySmall)
                          }
                      }
                  } else {
                      LazyColumn(Modifier.fillMaxSize().padding(horizontal = 12.dp)) {
                          items(profiles, key = { it.url }) { p -> ProfileCard(p) { openUrl(ctx, p.url) } }
                          item { Spacer(Modifier.height(16.dp)) }
                      }
                  }

                  Button(
                      onClick = onBackToCamera,
                      modifier = Modifier.fillMaxWidth().padding(16.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = NeoPurple)
                  ) {
                      Icon(Icons.Default.CameraAlt, null); Spacer(Modifier.width(8.dp))
                      Text("חפש שוב")
                  }
              }
          }

          @Composable
          private fun ProfileCard(p: SocialProfile, onClick: () -> Unit) {
              Surface(
                  Modifier.fillMaxWidth().padding(vertical = 6.dp)
                      .clip(RoundedCornerShape(14.dp)).clickable { onClick() },
                  color = NeoSurface
              ) {
                  Row(Modifier.padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
                      Surface(
                          Modifier.size(64.dp).clip(RoundedCornerShape(10.dp)),
                          color = NeoBg
                      ) {
                          Box(contentAlignment = Alignment.Center) {
                              Icon(Icons.Default.Person, null, tint = NeoCyan)
                          }
                      }
                      Spacer(Modifier.width(12.dp))
                      Column(Modifier.weight(1f)) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Text(platformEmoji(p.platform), fontSize = 18.sp)
                              Spacer(Modifier.width(6.dp))
                              Text(p.platform, color = NeoCyan,
                                  style = MaterialTheme.typography.titleMedium,
                                  fontWeight = FontWeight.Bold)
                              Spacer(Modifier.weight(1f))
                              if (p.score > 0) {
                                  Text("${"%.0f".format(p.score * 100)}%",
                                      color = if (p.score > 0.7) NeoGreen else NeoPurple,
                                      style = MaterialTheme.typography.labelLarge)
                              }
                          }
                          if (p.title.isNotBlank()) {
                              Text(p.title, color = Color.White,
                                  style = MaterialTheme.typography.bodyMedium, maxLines = 1)
                          }
                          Text(p.url, color = Color.Gray,
                              style = MaterialTheme.typography.bodySmall, maxLines = 1)
                      }
                      Icon(Icons.Default.OpenInNew, null, tint = NeoCyan)
                  }
              }
          }

          private fun platformEmoji(p: String) = when (p) {
              "Instagram" -> "📷"
              "TikTok" -> "🎵"
              "Facebook" -> "📘"
              "X" -> "🐦"
              "LinkedIn" -> "💼"
              "YouTube" -> "▶️"
              "VK" -> "🇷🇺"
              "Telegram" -> "✈️"
              "Pinterest" -> "📌"
              "Reddit" -> "👽"
              else -> "🌐"
          }

          private fun openUrl(ctx: android.content.Context, url: String) {
              try {
                  ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url))
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
              } catch (_: Exception) {}
          }
