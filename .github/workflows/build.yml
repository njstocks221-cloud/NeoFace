          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.runtime.saveable.rememberSaveable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.window.Dialog
          import androidx.compose.ui.window.DialogProperties
          import androidx.lifecycle.viewmodel.compose.viewModel
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.HttpUrl.Companion.toHttpUrlOrNull
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          private val NeoPurple = Color(0xFF7C4DFF)
          private val NeoCyan = Color(0xFF00E5FF)
          private val NeoBg = Color(0xFF0A0E27)
          private val NeoSurface = Color(0xFF151A35)
          private val NeoGreen = Color(0xFF00E676)
          private val NeoRed = Color(0xFFFF5252)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              primary = NeoPurple,
                              secondary = NeoCyan,
                              background = NeoBg,
                              surface = NeoSurface,
                              onPrimary = Color.White,
                              onBackground = Color.White,
                              onSurface = Color.White,
                              error = NeoRed
                          )
                      ) {
                          NeoFaceApp()
                      }
                  }
              }
          }

          @Composable
          private fun NeoFaceApp(vm: NeoViewModel = viewModel()) {
              var page by rememberSaveable { mutableStateOf("search") }
              val selected by vm.selected.collectAsState()
              val busy by vm.busy.collectAsState()
              val status by vm.status.collectAsState()
              val error by vm.error.collectAsState()

              BackHandler(enabled = selected != null && !busy) {
                  vm.closeResults()
              }

              Scaffold(
                  containerColor = NeoBg,
                  bottomBar = {
                      NavigationBar(containerColor = NeoSurface) {
                          NavigationBarItem(
                              selected = page == "search" && selected == null,
                              onClick = {
                                  vm.closeResults()
                                  page = "search"
                              },
                              icon = { Icon(Icons.Default.Search, null) },
                              label = { Text("חיפוש") }
                          )
                          NavigationBarItem(
                              selected = page == "history" && selected == null,
                              onClick = {
                                  vm.closeResults()
                                  page = "history"
                              },
                              icon = { Icon(Icons.Default.History, null) },
                              label = { Text("היסטוריה") }
                          )
                          NavigationBarItem(
                              selected = page == "settings" && selected == null,
                              onClick = {
                                  vm.closeResults()
                                  page = "settings"
                              },
                              icon = { Icon(Icons.Default.Settings, null) },
                              label = { Text("הגדרות") }
                          )
                      }
                  }
              ) { padding ->
                  Box(
                      Modifier.fillMaxSize()
                          .padding(padding)
                          .background(NeoBg)
                  ) {
                      val record = selected
                      when {
                          record != null -> ResultsScreen(
                              record = record,
                              onError = vm::showError
                          )
                          page == "history" -> HistoryScreen(vm)
                          page == "settings" -> SettingsScreen(vm::showError)
                          else -> SearchScreen(vm)
                      }
                  }
              }

              if (busy) {
                  Dialog(
                      onDismissRequest = {},
                      properties = DialogProperties(
                          dismissOnBackPress = false,
                          dismissOnClickOutside = false
                      )
                  ) {
                      Surface(
                          shape = RoundedCornerShape(20.dp),
                          color = NeoSurface
                      ) {
                          Column(
                              Modifier.fillMaxWidth().padding(28.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              CircularProgressIndicator(color = NeoCyan)
                              Spacer(Modifier.height(20.dp))
                              Text(status, color = NeoCyan)
                              Spacer(Modifier.height(12.dp))
                              TextButton(onClick = vm::cancelSearch) {
                                  Text("ביטול")
                              }
                          }
                      }
                  }
              }

              error?.let { message ->
                  AlertDialog(
                      onDismissRequest = vm::clearError,
                      title = { Text("שגיאה", color = NeoRed) },
                      text = { Text(message) },
                      confirmButton = {
                          TextButton(onClick = vm::clearError) {
                              Text("אישור")
                          }
                      },
                      containerColor = NeoSurface
                  )
              }
          }

          @Composable
          private fun SearchScreen(vm: NeoViewModel) {
              val context = LocalContext.current
              val picker = rememberLauncherForActivityResult(
                  ActivityResultContracts.GetContent()
              ) { uri ->
                  if (uri != null) vm.search(uri)
              }

              Column(
                  modifier = Modifier.fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(28.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  Text(
                      "NeoFace",
                      color = NeoCyan,
                      style = MaterialTheme.typography.headlineLarge,
                      fontWeight = FontWeight.Bold
                  )

                  Spacer(Modifier.height(40.dp))

                  FloatingActionButton(
                      onClick = {
                          if (Settings.apiKey(context).isBlank()) {
                              vm.showError("יש להזין מפתח API בהגדרות")
                          } else {
                              try {
                                  picker.launch("image/*")
                              } catch (e: Exception) {
                                  vm.showError(
                                      e.message ?: "Cannot open image picker"
                                  )
                              }
                          }
                      },
                      modifier = Modifier.size(112.dp),
                      shape = CircleShape,
                      containerColor = NeoCyan
                  ) {
                      Icon(
                          Icons.Default.Image,
                          contentDescription = "בחר תמונה",
                          modifier = Modifier.size(54.dp),
                          tint = NeoBg
                      )
                  }

                  Spacer(Modifier.height(24.dp))
                  Text("בחר תמונה לחיפוש", color = NeoCyan)
              }
          }

          @Composable
          private fun ResultsScreen(
              record: SearchRecord,
              onError: (String) -> Unit
          ) {
              val context = LocalContext.current
              var links by remember(record.id) {
                  mutableStateOf<List<SocialLink>>(emptyList())
              }
              var loading by remember(record.id) { mutableStateOf(true) }
              var parseError by remember(record.id) {
                  mutableStateOf<String?>(null)
              }

              LaunchedEffect(record.id, record.resultsJson) {
                  loading = true
                  try {
                      links = withContext(Dispatchers.Default) {
                          parseLinks(record.resultsJson)
                      }
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      parseError = e.message ?: "Cannot read saved links"
                  } finally {
                      loading = false
                  }
              }

              val message = record.error ?: parseError

              when {
                  loading -> Box(
                      Modifier.fillMaxSize(),
                      contentAlignment = Alignment.Center
                  ) {
                      CircularProgressIndicator(color = NeoCyan)
                  }

                  message != null -> Box(
                      Modifier.fillMaxSize().padding(24.dp),
                      contentAlignment = Alignment.Center
                  ) {
                      Text(
                          message,
                          color = NeoRed,
                          textAlign = TextAlign.Center
                      )
                  }

                  links.isEmpty() -> Box(
                      Modifier.fillMaxSize().padding(24.dp),
                      contentAlignment = Alignment.Center
                  ) {
                      Text(
                          "השרת לא החזיר קישורים לרשתות חברתיות",
                          color = Color.Gray,
                          textAlign = TextAlign.Center
                      )
                  }

                  else -> LazyColumn(
                      modifier = Modifier.fillMaxSize(),
                      contentPadding = PaddingValues(12.dp)
                  ) {
                      // Results contain only clickable social URLs.
                      // No scores, titles, thumbnails, or non-social sites.
                      items(links, key = { it.url }) { link ->
                          Surface(
                              color = NeoSurface,
                              shape = RoundedCornerShape(14.dp),
                              modifier = Modifier.fillMaxWidth()
                                  .padding(vertical = 6.dp)
                                  .clickable {
                                      try {
                                          SocialLinks.open(context, link)
                                      } catch (e: Exception) {
                                          onError(
                                              e.message ?: "Cannot open link"
                                          )
                                      }
                                  }
                          ) {
                              Text(
                                  text = link.url,
                                  color = NeoCyan,
                                  modifier = Modifier.padding(18.dp),
                                  style = MaterialTheme.typography.bodyLarge
                              )
                          }
                      }
                  }
              }
          }

          private fun formattedDate(timestamp: Long): String =
              SimpleDateFormat(
                  "dd/MM/yyyy HH:mm",
                  Locale.getDefault()
              ).format(Date(timestamp))

          @Composable
          private fun HistoryScreen(vm: NeoViewModel) {
              val records by vm.history.collectAsState()

              Column(Modifier.fillMaxSize()) {
                  Text(
                      "היסטוריית חיפושים",
                      modifier = Modifier.padding(16.dp),
                      color = NeoCyan,
                      style = MaterialTheme.typography.titleLarge
                  )

                  if (records.isEmpty()) {
                      Box(
                          Modifier.weight(1f).fillMaxWidth(),
                          contentAlignment = Alignment.Center
                      ) {
                          Text("אין חיפושים שמורים", color = Color.Gray)
                      }
                  } else {
                      LazyColumn(Modifier.weight(1f)) {
                          items(records, key = { it.id }) { record ->
                              Surface(
                                  color = NeoSurface,
                                  shape = RoundedCornerShape(12.dp),
                                  modifier = Modifier.fillMaxWidth()
                                      .padding(horizontal = 12.dp, vertical = 5.dp)
                                      .clickable { vm.open(record) }
                              ) {
                                  Row(
                                      Modifier.padding(12.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Text(
                                          formattedDate(record.timestamp),
                                          color = NeoCyan,
                                          modifier = Modifier.weight(1f)
                                      )
                                      IconButton(
                                          onClick = { vm.delete(record) }
                                      ) {
                                          Icon(
                                              Icons.Default.Delete,
                                              "מחק",
                                              tint = NeoRed
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun SettingsScreen(onError: (String) -> Unit) {
              val context = LocalContext.current
              var key by remember { mutableStateOf(Settings.apiKey(context)) }
              var url by remember { mutableStateOf(Settings.baseUrl(context)) }
              var saved by remember { mutableStateOf(false) }

              Column(
                  modifier = Modifier.fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(16.dp)
              ) {
                  Text(
                      "הגדרות NeoFace",
                      color = NeoCyan,
                      style = MaterialTheme.typography.headlineSmall
                  )

                  Spacer(Modifier.height(20.dp))

                  OutlinedTextField(
                      value = key,
                      onValueChange = {
                          key = it
                          saved = false
                      },
                      label = { Text("API Key") },
                      visualTransformation = PasswordVisualTransformation(),
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )

                  Spacer(Modifier.height(16.dp))

                  OutlinedTextField(
                      value = url,
                      onValueChange = {
                          url = it
                          saved = false
                      },
                      label = { Text("Base URL") },
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )

                  Spacer(Modifier.height(20.dp))

                  Button(
                      onClick = {
                          val parsed = url.trim().toHttpUrlOrNull()
                          when {
                              parsed == null || !parsed.isHttps ->
                                  onError("יש להזין כתובת HTTPS תקינה")
                              parsed.username.isNotEmpty() ||
                                  parsed.password.isNotEmpty() ->
                                  onError("אין לכלול סיסמה בכתובת השרת")
                              else -> {
                                  Settings.save(
                                      context,
                                      key,
                                      parsed.newBuilder()
                                          .query(null)
                                          .fragment(null)
                                          .build()
                                          .toString()
                                  )
                                  saved = true
                              }
                          }
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Icon(Icons.Default.Save, null)
                      Spacer(Modifier.width(8.dp))
                      Text("שמור")
                  }

                  if (saved) {
                      Text(
                          "נשמר בהצלחה",
                          color = NeoGreen,
                          modifier = Modifier.padding(vertical = 12.dp)
                      )
                  }

                  Spacer(Modifier.height(24.dp))

                  Text(
                      "התמונה ומפתח ה-API נשלחים לשרת שהגדרת. השתמש רק בשרת שאתה סומך עליו ובתמונות שיש לך הרשאה להשתמש בהן.",
                      color = Color.Gray,
                      style = MaterialTheme.typography.bodySmall
                  )
              }
          }
