                                  "לא נמצאו פרופילים",
                                  modifier = Modifier.fillMaxWidth()
                                      .padding(32.dp),
                                  textAlign = TextAlign.Center
                              )
                          }
                      }

                      items(profiles, key = { it.url }) { profile ->
                          Surface(
                              color = NeoSurface,
                              shape = RoundedCornerShape(14.dp),
                              modifier = Modifier.fillMaxWidth()
                                  .padding(vertical = 6.dp)
                                  .clickable {
                                      try {
                                          context.startActivity(
                                              Intent(
                                                  Intent.ACTION_VIEW,
                                                  Uri.parse(profile.url)
                                              )
                                          )
                                      } catch (e: Exception) {
                                          onError(
                                              e.message ?: "Cannot open link"
                                          )
                                      }
                                  }
                          ) {
                              Column(Modifier.padding(16.dp)) {
                                  Row(
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Text(
                                          profile.platform,
                                          color = NeoCyan,
                                          fontWeight = FontWeight.Bold,
                                          modifier = Modifier.weight(1f)
                                      )
                                      Text(
                                          "${(profile.score * 100).toInt()}%",
                                          color = NeoGreen
                                      )
                                      Spacer(Modifier.width(10.dp))
                                      Icon(
                                          Icons.Default.OpenInNew,
                                          null,
                                          tint = NeoCyan
                                      )
                                  }

                                  if (profile.title.isNotBlank()) {
                                      Spacer(Modifier.height(6.dp))
                                      Text(profile.title, maxLines = 2)
                                  }

                                  Spacer(Modifier.height(4.dp))
                                  Text(
                                      profile.url,
                                      color = Color.Gray,
                                      style = MaterialTheme.typography.bodySmall,
                                      maxLines = 2
                                  )
                              }
                          }
                      }
                  }

                  Button(
                      onClick = onBack,
                      modifier = Modifier.fillMaxWidth().padding(16.dp)
                  ) {
                      Text("חפש שוב")
                  }
              }
          }

          @Composable
          private fun HistoryScreen(vm: NeoViewModel) {
              val records by vm.history.collectAsState()

              Column(Modifier.fillMaxSize()) {
                  Text(
                      "היסטוריית חיפושים (${records.size})",
                      modifier = Modifier.padding(16.dp),
                      color = NeoCyan,
                      style = MaterialTheme.typography.titleLarge
                  )

                  if (records.isEmpty()) {
                      Box(
                          Modifier.weight(1f).fillMaxWidth(),
                          contentAlignment = Alignment.Center
                      ) {
                          Text("אין חיפושים שמורים", color = Color.Gray)
                      }
                  } else {
                      LazyColumn(Modifier.weight(1f)) {
                          items(records, key = { it.id }) { record ->
                              Surface(
                                  color = NeoSurface,
                                  shape = RoundedCornerShape(12.dp),
                                  modifier = Modifier.fillMaxWidth()
                                      .padding(horizontal = 12.dp, vertical = 5.dp)
                                      .clickable { vm.open(record) }
                              ) {
                                  Row(
                                      Modifier.padding(12.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Thumbnail(
                                          record.photoPath,
                                          Modifier.size(52.dp)
                                      )

                                      Spacer(Modifier.width(12.dp))

                                      Column(Modifier.weight(1f)) {
                                          Text(
                                              if (record.error == null) {
                                                  "${record.resultCount} פרופילים"
                                              } else {
                                                  "שגיאה בחיפוש"
                                              },
                                              color = if (record.error == null) {
                                                  NeoCyan
                                              } else {
                                                  NeoRed
                                              }
                                          )
                                          Text(
                                              formattedDate(record.timestamp),
                                              color = Color.Gray,
                                              style = MaterialTheme.typography.bodySmall
                                          )
                                      }

                                      IconButton(
                                          onClick = { vm.delete(record) }
                                      ) {
                                          Icon(
                                              Icons.Default.Delete,
                                              "מחק",
                                              tint = NeoRed
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun SettingsScreen(onError: (String) -> Unit) {
              val context = LocalContext.current
              var key by remember { mutableStateOf(Settings.apiKey(context)) }
              var url by remember { mutableStateOf(Settings.baseUrl(context)) }
              var saved by remember { mutableStateOf(false) }

              Column(
                  modifier = Modifier.fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(16.dp)
              ) {
                  Text(
                      "הגדרות NeoFace",
                      color = NeoCyan,
                      style = MaterialTheme.typography.headlineSmall
                  )

                  Spacer(Modifier.height(20.dp))

                  OutlinedTextField(
                      value = key,
                      onValueChange = {
                          key = it
                          saved = false
                      },
                      label = { Text("API Key") },
                      visualTransformation = PasswordVisualTransformation(),
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )

                  Spacer(Modifier.height(16.dp))

                  OutlinedTextField(
                      value = url,
                      onValueChange = {
                          url = it
                          saved = false
                      },
                      label = { Text("Base URL") },
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth()
                  )

                  Spacer(Modifier.height(20.dp))

                  Button(
                      onClick = {
                          val parsed = url.trim().toHttpUrlOrNull()
                          when {
                              parsed == null || !parsed.isHttps ->
                                  onError("יש להזין כתובת HTTPS תקינה")
                              parsed.username.isNotEmpty() ||
                                  parsed.password.isNotEmpty() ->
                                  onError("אין לכלול סיסמה בכתובת השרת")
                              else -> {
                                  Settings.save(
                                      context,
                                      key,
                                      parsed.newBuilder()
                                          .query(null)
                                          .fragment(null)
                                          .build()
                                          .toString()
                                  )
                                  saved = true
                              }
                          }
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Icon(Icons.Default.Save, null)
                      Spacer(Modifier.width(8.dp))
                      Text("שמור")
                  }

                  if (saved) {
                      Text(
                          "נשמר בהצלחה",
                          color = NeoGreen,
                          modifier = Modifier.padding(vertical = 12.dp)
                      )
                  }

                  Spacer(Modifier.height(24.dp))

                  Surface(
                      color = NeoSurface,
                      shape = RoundedCornerShape(14.dp)
                  ) {
                      Text(
                          "התמונה ומפתח ה-API נשלחים לשרת שהגדרת. הזן רק כתובת שרת שאתה סומך עליו. אין צורך בהרשאת מצלמה או אחסון כדי לבחור תמונה.",
                          modifier = Modifier.padding(16.dp),
                          style = MaterialTheme.typography.bodySmall
                      )
                  }

                  Spacer(Modifier.height(24.dp))
                  Text("NeoFace v1.0.1", color = Color.Gray)
              }
          }
          EOF

      name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoFace-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NeoFace build ${{ github.run_number }}
          body: |
            NeoFace Android debug build.

            Download app-debug.apk, install it, and enter your API
            key and HTTPS server address in Settings.

            This build uses the configured server's /v1/api/search
            endpoint and expects a JSON results array.

            Only upload images you have permission to use.
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
