                              if (
                                  apiKey.isBlank()
                              ) {
                                  return@FloatingActionButton
                              }

                              getContentLauncher.launch(
                                  "image/*"
                              )
                          },

                          modifier =
                              Modifier.size(
                                  120.dp
                              ),

                          shape =
                              CircleShape,

                          containerColor =
                              NeoCyan
                      ) {

                          Icon(
                              Icons.Default.CameraAlt,
                              "בחר תמונה",
                              tint =
                                  NeoBg,
                              modifier =
                                  Modifier.size(
                                      56.dp
                                  )
                          )
                      }

                      Spacer(
                          Modifier.height(
                              24.dp
                          )
                      )

                      Text(
                          "בחר תמונה מהגלריה או מהמצלמה",
                          color =
                              NeoCyan,
                          style =
                              MaterialTheme
                                  .typography
                                  .bodyLarge
                      )
                  }

                  if (
                      busy
                  ) {

                      Box(
                          Modifier
                              .fillMaxSize()
                              .background(
                                  Color.Black.copy(
                                      alpha = 0.8f
                                  )
                              )
                      ) {

                          Column(
                              Modifier.align(
                                  Alignment.Center
                              ),
                              horizontalAlignment =
                                  Alignment.CenterHorizontally
                          ) {

                              CircularProgressIndicator(
                                  color =
                                      NeoCyan
                              )

                              Spacer(
                                  Modifier.height(
                                      16.dp
                                  )
                              )

                              Text(
                                  status,
                                  color =
                                      NeoCyan,
                                  style =
                                      MaterialTheme
                                          .typography
                                          .titleMedium,
                                  textAlign =
                                      TextAlign.Center
                              )
                          }
                      }
                  }
              }

              if (
                  errorMessage != null
              ) {

                  AlertDialog(

                      onDismissRequest = {
                          errorMessage =
                              null
                      },

                      title = {
                          Text(
                              "שגיאה",
                              color =
                                  NeoRed
                          )
                      },

                      text = {
                          Text(
                              errorMessage!!,
                              color =
                                  Color.White
                          )
                      },

                      confirmButton = {

                          TextButton(
                              onClick = {
                                  errorMessage =
                                      null
                              }
                          ) {

                              Text(
                                  "אישור",
                                  color =
                                      NeoCyan
                              )
                          }
                      },

                      containerColor =
                          NeoSurface
                  )
              }
          }
