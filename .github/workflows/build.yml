          cat > app/src/main/java/com/neoface/AppRoot.kt << 'EOF'
          package com.neoface

          import androidx.compose.foundation.layout.padding
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.platform.LocalContext
          import androidx.navigation.NavType
          import androidx.navigation.compose.*
          import androidx.navigation.navArgument
          import com.neoface.data.AppDatabase
          import com.neoface.ui.*

          data class NavItem(val route: String, val label: String, val icon: ImageVector)

          @Composable
          fun AppRoot() {
              val ctx = LocalContext.current
              val db = remember { AppDatabase.get(ctx) }
              val dao = db.dao()
              val nav = rememberNavController()
              val backStack by nav.currentBackStackEntryAsState()
              val current = backStack?.destination?.route ?: "camera"

              val items = listOf(
                  NavItem("camera", "מצלמה", Icons.Default.CameraAlt),
                  NavItem("history", "היסטוריה", Icons.Default.History),
                  NavItem("settings", "הגדרות", Icons.Default.Settings)
              )

              Scaffold(
                  bottomBar = {
                      NavigationBar(containerColor = NeoSurface) {
                          items.forEach { it ->
                              val selected = current == it.route || current.startsWith("${it.route}/")
                              NavigationBarItem(
                                  selected = selected,
                                  onClick = {
                                      if (!selected) nav.navigate(it.route) {
                                          popUpTo("camera") { inclusive = false }
                                          launchSingleTop = true
                                      }
                                  },
                                  icon = { Icon(it.icon, it.label) },
                                  label = { Text(it.label) },
                                  colors = NavigationBarItemDefaults.colors(
                                      selectedIconColor = NeoCyan,
                                      selectedTextColor = NeoCyan,
                                      indicatorColor = NeoPurple
                                  )
                              )
                          }
                      }
                  }
              ) { pad ->
                  NavHost(nav, "camera", Modifier.padding(pad)) {
                      composable("camera") {
                          CameraScreen(dao) { id -> nav.navigate("results/$id") }
                      }
                      composable(
                          "results/{id}",
                          arguments = listOf(navArgument("id") { type = NavType.LongType })
                      ) { entry ->
                          val id = entry.arguments?.getLong("id") ?: 0L
                          ResultsScreen(dao, id) { nav.navigate("camera") }
                      }
                      composable("history") {
                          HistoryScreen(dao) { id -> nav.navigate("results/$id") }
                      }
                      composable("settings") { SettingsScreen() }
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/neoface/ui/CameraScreen.kt << 'EOF'
          package com.neoface.ui

          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.CameraAlt
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import com.neoface.*
          import com.neoface.data.SearchRecord
          import com.neoface.data.SearchDao
          import com.neoface.engine.SocialSearchClient
          import com.neoface.engine.decodeUri
          import com.neoface.engine.savePhoto
          import com.neoface.engine.toJson
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray

          @Composable
          fun CameraScreen(dao: SearchDao, onComplete: (Long) -> Unit) {
              val ctx = LocalContext.current
              val scope = rememberCoroutineScope()
              var busy by remember { mutableStateOf(false) }
              var status by remember { mutableStateOf("") }
              var errorMessage by remember { mutableStateOf<String?>(null) }

              val apiKey = Settings.getApiKey(ctx)
              val baseUrl = Settings.getBaseUrl(ctx)

              val getContentLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.GetContent()
              ) { uri ->
                  if (uri != null) {
                      busy = true
                      status = "מעבד תמונה..."
                      scope.launch {
                          try {
                              val bmp = decodeUri(ctx, uri, 1024)
                              if (bmp == null) {
                                  errorMessage = "לא ניתן לקרוא את התמונה. נסה שוב."
                                  busy = false
                                  return@launch
                              }
                              
                              val localPath = savePhoto(ctx, bmp)
                              status = "שולח לשרת (עד 5 דקות)..."
                              val client = SocialSearchClient(apiKey = apiKey, baseUrl = baseUrl)
                              val apiResult = client.search(bmp)
                              val json = try {
                                  JSONArray().apply {
                                      apiResult.getOrNull()?.forEach { put(it.toJson()) }
                                  }.toString()
                              } catch (e: Exception) { "[]" }
                              
                              val count = apiResult.getOrNull()?.size ?: 0
                              val err = apiResult.exceptionOrNull()?.message
                              val rec = SearchRecord(
                                  photoPath = localPath,
                                  resultsJson = json,
                                  resultCount = count,
                                  error = err
                              )
                              val id = withContext(Dispatchers.IO) {
                                  try { dao.insert(rec) } catch (e: Exception) { 0L }
                              }
                              withContext(Dispatchers.Main) {
                                  busy = false
                                  status = ""
                                  if (id > 0) onComplete(id)
                                  else errorMessage = "שגיאה בשמירת הנתונים"
                              }
                          } catch (e: Exception) {
                              busy = false
                              errorMessage = "שגיאה: ${e.message}"
                          }
                      }
                  }
              }

              Box(Modifier.fillMaxSize().background(NeoBg)) {
                  Column(
                      Modifier.fillMaxSize().padding(32.dp),
                      verticalArrangement = Arrangement.Center,
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Text("NeoFace", color = NeoCyan, style = MaterialTheme.typography.headlineLarge, fontWeight = androidx.compose.ui.text.font.FontWeight.Bold)
                      Spacer(Modifier.height(8.dp))
                      Text("חיפוש פנים הפוך", color = Color.Gray, style = MaterialTheme.typography.bodyLarge)
                      Spacer(Modifier.height(48.dp))

                      if (apiKey.isBlank()) {
                          Text("⚠️ חסר מפתח API. עבור להגדרות.", color = NeoRed, style = MaterialTheme.typography.bodyMedium)
                          Spacer(Modifier.height(16.dp))
                      }

                      FloatingActionButton(
                          onClick = {
                              if (apiKey.isBlank()) return@FloatingActionButton
                              getContentLauncher.launch("image/*")
                          },
                          modifier = Modifier.size(120.dp),
                          shape = CircleShape,
                          containerColor = NeoCyan
                      ) {
                          Icon(Icons.Default.CameraAlt, "בחר תמונה", tint = NeoBg, modifier = Modifier.size(56.dp))
                      }
                      Spacer(Modifier.height(24.dp))
                      Text("בחר תמונה מהגלריה או מהמצלמה", color = NeoCyan, style = MaterialTheme.typography.bodyLarge)
                  }

                  if (busy) {
                      Box(Modifier.fillMaxSize().background(Color.Black.copy(alpha = 0.8f))) {
                          Column(Modifier.align(Alignment.Center), horizontalAlignment = Alignment.CenterHorizontally) {
                              CircularProgressIndicator(color = NeoCyan)
                              Spacer(Modifier.height(16.dp))
                              Text(status, color = NeoCyan, style = MaterialTheme.typography.titleMedium, textAlign = TextAlign.Center)
                          }
                      }
                  }
              }

              if (errorMessage != null) {
                  AlertDialog(
                      onDismissRequest = { errorMessage = null },
                      title = { Text("שגיאה", color = NeoRed) },
                      text = { Text(errorMessage!!, color = Color.White) },
                      confirmButton = {
                          TextButton(onClick = { errorMessage = null }) {
                              Text("אישור", color = NeoCyan)
                          }
                      },
                      containerColor = NeoSurface
                  )
              }
          }
          EOF

