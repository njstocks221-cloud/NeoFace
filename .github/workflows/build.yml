          cat > app/src/main/java/com/neoface/NeoTheme.kt << 'EOF'
          package com.neoface

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          val NeoPurple = Color(0xFF7C4DFF)
          val NeoCyan = Color(0xFF00E5FF)
          val NeoBg = Color(0xFF0A0E27)
          val NeoSurface = Color(0xFF151A35)
          val NeoGreen = Color(0xFF00E676)
          val NeoRed = Color(0xFFFF5252)

          private val NeoColorScheme = darkColorScheme(
              primary = NeoPurple,
              onPrimary = Color.White,
              secondary = NeoCyan,
              onSecondary = NeoBg,
              background = NeoBg,
              onBackground = Color.White,
              surface = NeoSurface,
              onSurface = Color.White,
              error = NeoRed
          )

          @Composable
          fun NeoFaceTheme(
              content: @Composable () -> Unit
          ) {
              MaterialTheme(
                  colorScheme = NeoColorScheme,
                  content = content
              )
          }
          EOF

          cat > app/src/main/java/com/neoface/Settings.kt << 'EOF'
          package com.neoface

          import android.content.Context

          object Settings {

              private const val PREFS = "neoface_prefs"
              private const val KEY_API = "api_key"
              private const val KEY_URL = "base_url"

              const val DEFAULT_URL = "https://api.faceseek.online"

              fun getApiKey(ctx: Context): String {
                  return ctx
                      .getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                      )
                      .getString(
                          KEY_API,
                          ""
                      ) ?: ""
              }

              fun setApiKey(
                  ctx: Context,
                  key: String
              ) {
                  ctx
                      .getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                      )
                      .edit()
                      .putString(
                          KEY_API,
                          key.trim()
                      )
                      .apply()
              }

              fun getBaseUrl(ctx: Context): String {
                  return ctx
                      .getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                      )
                      .getString(
                          KEY_URL,
                          DEFAULT_URL
                      ) ?: DEFAULT_URL
              }

              fun setBaseUrl(
                  ctx: Context,
                  url: String
              ) {
                  ctx
                      .getSharedPreferences(
                          PREFS,
                          Context.MODE_PRIVATE
                      )
                      .edit()
                      .putString(
                          KEY_URL,
                          url.trim()
                      )
                      .apply()
              }
          }
          EOF

          cat > app/src/main/java/com/neoface/data/SearchRecord.kt << 'EOF'
          package com.neoface.data

          import androidx.room.Entity
          import androidx.room.PrimaryKey

          @Entity(tableName = "searches")
          data class SearchRecord(
              @PrimaryKey(autoGenerate = true)
              val id: Long = 0,

              val photoPath: String,

              val timestamp: Long = System.currentTimeMillis(),

              val resultsJson: String,

              val resultCount: Int = 0,

              val error: String? = null
          )
          EOF

          cat > app/src/main/java/com/neoface/data/SearchDao.kt << 'EOF'
          package com.neoface.data

          import androidx.room.Dao
          import androidx.room.Delete
          import androidx.room.Insert
          import androidx.room.Query
          import kotlinx.coroutines.flow.Flow

          @Dao
          interface SearchDao {

              @Insert
              suspend fun insert(
                  s: SearchRecord
              ): Long

              @Query(
                  "SELECT * FROM searches ORDER BY timestamp DESC"
              )
              fun all(): Flow<List<SearchRecord>>

              @Query(
                  "SELECT * FROM searches WHERE id = :id"
              )
              suspend fun get(
                  id: Long
              ): SearchRecord?

              @Query(
                  "SELECT * FROM searches WHERE id = :id"
              )
              fun observe(
                  id: Long
              ): Flow<SearchRecord?>

              @Delete
              suspend fun delete(
                  s: SearchRecord
              )

              @Query(
                  "DELETE FROM searches"
              )
              suspend fun clear()
          }
          EOF

          cat > app/src/main/java/com/neoface/data/AppDatabase.kt << 'EOF'
          package com.neoface.data

          import android.content.Context
          import androidx.room.Database
          import androidx.room.Room
          import androidx.room.RoomDatabase

          @Database(
              entities = [SearchRecord::class],
              version = 1,
              exportSchema = false
          )
          abstract class AppDatabase : RoomDatabase() {

              abstract fun dao(): SearchDao

              companion object {

                  @Volatile
                  private var instance: AppDatabase? = null

                  fun get(
                      ctx: Context
                  ): AppDatabase {

                      return instance
                          ?: synchronized(this) {

                              instance
                                  ?: Room
                                      .databaseBuilder(
                                          ctx.applicationContext,
                                          AppDatabase::class.java,
                                          "neoface.db"
                                      )
                                      .build()
                                      .also {
                                          instance = it
                                      }
                          }
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/neoface/engine/ImageUtils.kt << 'EOF'
          package com.neoface.engine

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import java.io.File

          fun savePhoto(
              ctx: Context,
              bmp: Bitmap
          ): String {

              val dir = File(
                  ctx.filesDir,
                  "photos"
              )

              if (!dir.exists()) {
                  dir.mkdirs()
              }

              val file = File(
                  dir,
                  "face_${System.currentTimeMillis()}.jpg"
              )

              file.outputStream().use { out ->

                  bmp.compress(
                      Bitmap.CompressFormat.JPEG,
                      90,
                      out
                  )
              }

              return file.absolutePath
          }

          fun decodeUri(
              ctx: Context,
              uri: Uri,
              maxDim: Int = 1024
          ): Bitmap? {

              return try {

                  val options =
                      BitmapFactory.Options().apply {
                          inJustDecodeBounds = true
                      }

                  ctx.contentResolver
                      .openInputStream(uri)
                      ?.use { input ->
                          BitmapFactory.decodeStream(
                              input,
                              null,
                              options
                          )
                      }

                  var inSampleSize = 1

                  val width = options.outWidth
                  val height = options.outHeight

                  if (
                      width > maxDim ||
                      height > maxDim
                  ) {

                      val halfHeight = height / 2
                      val halfWidth = width / 2

                      while (
                          halfHeight / inSampleSize >= maxDim &&
                          halfWidth / inSampleSize >= maxDim
                      ) {
                          inSampleSize *= 2
                      }
                  }

                  options.inJustDecodeBounds = false
                  options.inSampleSize = inSampleSize

                  ctx.contentResolver
                      .openInputStream(uri)
                      ?.use { input ->
                          BitmapFactory.decodeStream(
                              input,
                              null,
                              options
                          )
                      }

              } catch (_: Exception) {

                  null
              }
          }

          fun decodeFileScaled(
              path: String,
              maxDim: Int = 512
          ): Bitmap? {

              return try {

                  val options =
                      BitmapFactory.Options().apply {
                          inJustDecodeBounds = true
                      }

                  BitmapFactory.decodeFile(
                      path,
                      options
                  )

                  var inSampleSize = 1

                  val width = options.outWidth
                  val height = options.outHeight

                  if (
                      width > maxDim ||
                      height > maxDim
                  ) {

                      val halfHeight = height / 2
                      val halfWidth = width / 2

                      while (
                          halfHeight / inSampleSize >= maxDim &&
                          halfWidth / inSampleSize >= maxDim
                      ) {
                          inSampleSize *= 2
                      }
                  }

                  options.inJustDecodeBounds = false
                  options.inSampleSize = inSampleSize

                  BitmapFactory.decodeFile(
                      path,
                      options
                  )

              } catch (_: Exception) {

                  null
              }
          }
          EOF

          cat > app/src/main/java/com/neoface/engine/SocialSearchClient.kt << 'EOF'
          package com.neoface.engine

          import android.graphics.Bitmap
          import android.util.Log
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.MultipartBody
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.nio.charset.StandardCharsets
          import java.util.concurrent.TimeUnit

          data class SocialProfile(
              val url: String,
              val score: Float,
              val thumbnailUrl: String? = null,
              val platform: String = "",
              val title: String = ""
          )

          class SocialSearchClient(
              private val apiKey: String,
              private val baseUrl: String
          ) {

              companion object {

                  private const val TAG = "NeoFace"

                  // Prevent very large API responses from crashing the app.
                  private const val MAX_RESPONSE_SIZE =
                      5 * 1024 * 1024

                  private const val MAX_RESULTS = 50
              }

              private val http =
                  OkHttpClient.Builder()
                      .connectTimeout(
                          60,
                          TimeUnit.SECONDS
                      )
                      .readTimeout(
                          300,
                          TimeUnit.SECONDS
                      )
                      .writeTimeout(
                          300,
                          TimeUnit.SECONDS
                      )
                      .build()

              suspend fun search(
                  bitmap: Bitmap
              ): Result<List<SocialProfile>> =
                  withContext(Dispatchers.IO) {

                      try {

                          if (apiKey.isBlank()) {

                              return@withContext Result.failure(
                                  Exception(
                                      "חסר מפתח API — הזן מפתח API בהגדרות"
                                  )
                              )
                          }

                          val jpeg =
                              ByteArrayOutputStream().use { out ->

                                  val compressed =
                                      bitmap.compress(
                                          Bitmap.CompressFormat.JPEG,
                                          85,
                                          out
                                      )

                                  if (!compressed) {

                                      return@withContext Result.failure(
                                          Exception(
                                              "לא ניתן לדחוס את התמונה"
                                          )
                                      )
                                  }

                                  out.toByteArray()
                              }

                          Log.d(
                              TAG,
                              "Image size = ${jpeg.size} bytes"
                          )

                          val imageBody =
                              jpeg.toRequestBody(
                                  "image/jpeg".toMediaType()
                              )

                          val multipart =
                              MultipartBody.Builder()
                                  .setType(
                                      MultipartBody.FORM
                                  )
                                  .addFormDataPart(
                                      "file",
                                      "face.jpg",
                                      imageBody
                                  )
                                  .build()

                          val url =
                              baseUrl
                                  .trimEnd('/')
                                  .plus(
                                      "/v1/api/search"
                                  )

                          Log.d(
                              TAG,
                              "Request URL = $url"
                          )

                          val request =
                              Request.Builder()
                                  .url(url)
                                  .header(
                                      "X-API-Key",
                                      apiKey
                                  )
                                  .header(
                                      "Accept",
                                      "application/json"
                                  )
                                  .post(multipart)
                                  .build()

                          http.newCall(
                              request
                          ).execute().use { response ->

                              Log.d(
                                  TAG,
                                  "HTTP ${response.code} ${response.message}"
                              )

                              if (!response.isSuccessful) {

                                  val errorBody =
                                      try {
                                          response.body
                                              ?.string()
                                              ?.take(1000)
                                              .orEmpty()
                                      } catch (_: Exception) {
                                          ""
                                      }

                                  Log.e(
                                      TAG,
                                      "Server error: $errorBody"
                                  )

                                  return@withContext Result.failure(
                                      Exception(
                                          "HTTP ${response.code}: " +
                                              if (
                                                  errorBody.isNotBlank()
                                              ) {
                                                  errorBody
                                              } else {
                                                  response.message.ifBlank {
                                                      "שגיאת שרת"
                                                  }
                                              }
                                      )
                                  )
                              }

                              val responseBody =
                                  response.body

                              if (responseBody == null) {

                                  return@withContext Result.failure(
                                      Exception(
                                          "השרת החזיר תשובה ריקה"
                                      )
                                  )
                              }

                              val contentLength =
                                  responseBody.contentLength()

                              Log.d(
                                  TAG,
                                  "Content-Length = $contentLength"
                              )

                              if (
                                  contentLength > MAX_RESPONSE_SIZE
                              ) {

                                  return@withContext Result.failure(
                                      Exception(
                                          "תשובת השרת גדולה מדי " +
                                              "(${contentLength / 1024 / 1024} MB)"
                                      )
                                  )
                              }

                              /*
                               * Important:
                               * Do NOT use responseBody.string()
                               * without a size limit.
                               *
                               * We read the stream in chunks and stop
                               * if it exceeds MAX_RESPONSE_SIZE.
                               */

                              val bodyBytes =
                                  ByteArrayOutputStream(
                                      minOf(
                                          if (
                                              contentLength > 0
                                          ) {
                                              contentLength.toInt()
                                          } else {
                                              64 * 1024
                                          },
                                          MAX_RESPONSE_SIZE
                                      )
                                  )

                              val buffer =
                                  ByteArray(
                                      16 * 1024
                                  )

                              var totalRead = 0

                              responseBody
                                  .byteStream()
                                  .use { input ->

                                      while (true) {

                                          val read =
                                              input.read(
                                                  buffer
                                              )

                                          if (read == -1) {
                                              break
                                          }

                                          totalRead += read

                                          if (
                                              totalRead >
                                              MAX_RESPONSE_SIZE
                                          ) {

                                              Log.e(
                                                  TAG,
                                                  "Response exceeded maximum size"
                                              )

                                              return@withContext Result.failure(
                                                  Exception(
                                                      "תשובת השרת גדולה מדי. " +
                                                          "השרת החזיר יותר מ-5MB של נתונים."
                                                  )
                                              )
                                          }

                                          bodyBytes.write(
                                              buffer,
                                              0,
                                              read
                                          )
                                      }
                                  }

                              val body =
                                  bodyBytes
                                      .toByteArray()
                                      .toString(
                                          StandardCharsets.UTF_8
                                      )

                              if (body.isBlank()) {

                                  return@withContext Result.failure(
                                      Exception(
                                          "השרת החזיר תשובה ריקה"
                                      )
                                  )
                              }

                              Log.d(
                                  TAG,
                                  "Response received: ${body.length} characters"
                              )

                              val parsed =
                                  try {

                                      parse(body)

                                  } catch (e: Exception) {

                                      Log.e(
                                          TAG,
                                          "JSON parsing failed",
                                          e
                                      )

                                      return@withContext Result.failure(
                                          Exception(
                                              "השרת החזיר JSON לא תקין: " +
                                                  (e.message
                                                      ?: "שגיאה בפענוח")
                                          )
                                      )
                                  }

                              Log.d(
                                  TAG,
                                  "Parsed ${parsed.size} results"
                              )

                              Result.success(parsed)
                          }

                      } catch (e: Exception) {

                          Log.e(
                              TAG,
                              "Search request failed",
                              e
                          )

                          Result.failure(
                              Exception(
                                  e.message
                                      ?: "שגיאה לא ידועה בתקשורת עם השרת"
                              )
                          )
                      }
                  }

              private fun parse(
                  json: String
              ): List<SocialProfile> {

                  val list =
                      mutableListOf<SocialProfile>()

                  val root =
                      JSONObject(json)

                  val results =
                      root.optJSONArray(
                          "results"
                      ) ?: JSONArray()

                  val count =
                      minOf(
                          results.length(),
                          MAX_RESULTS
                      )

                  for (
                      i in 0 until count
                  ) {

                      val item =
                          results.optJSONObject(i)
                              ?: continue

                      val url =
                          item
                              .optString(
                                  "source_url"
                              )
                              .ifBlank {
                                  item.optString(
                                      "url"
                                  )
                              }

                      if (
                          url.isBlank()
                      ) {
                          continue
                      }

                      /*
                       * Ignore Base64 image fields completely.
                       * We do not store them in SocialProfile.
                       */

                      val rawScore =
                          item.optDouble(
                              "score",
                              0.0
                          )

                      val normalizedScore =
                          if (
                              rawScore > 1.0
                          ) {
                              rawScore / 100.0
                          } else {
                              rawScore
                          }

                      val score =
                          normalizedScore
                              .coerceIn(
                                  0.0,
                                  1.0
                              )
                              .toFloat()

                      val title =
                          item
                              .optString("title")
                              .ifBlank {
                                  item.optString(
                                      "domain"
                                  )
                              }

                      list.add(
                          SocialProfile(
                              url = url,
                              score = score,
                              thumbnailUrl = null,
                              platform = detect(
                                  url
                              ),
                              title = title
                          )
                      )
                  }

                  return list
                      .distinctBy {
                          it.url
                      }
                      .sortedByDescending {
                          it.score
                      }
              }

              private fun detect(
                  url: String
              ): String {

                  val lower =
                      url.lowercase()

                  return when {

                      lower.contains(
                          "instagram.com"
                      ) ->
                          "Instagram"

                      lower.contains(
                          "tiktok.com"
                      ) ->
                          "TikTok"

                      lower.contains(
                          "facebook.com"
                      ) ||
                          lower.contains(
                              "fb.com"
                          ) ->
                          "Facebook"

                      lower.contains(
                          "twitter.com"
                      ) ||
                          lower.contains(
                              "x.com"
                          ) ->
                          "X"

                      lower.contains(
                          "linkedin.com"
                      ) ->
                          "LinkedIn"

                      lower.contains(
                          "youtube.com"
                      ) ->
                          "YouTube"

                      lower.contains(
                          "vk.com"
                      ) ->
                          "VK"

                      lower.contains(
                          "ok.ru"
                      ) ->
                          "OK"

                      lower.contains(
                          "t.me"
                      ) ||
                          lower.contains(
                              "telegram"
                          ) ->
                          "Telegram"

                      lower.contains(
                          "pinterest.com"
                      ) ->
                          "Pinterest"

                      lower.contains(
                          "reddit.com"
                      ) ->
                          "Reddit"

                      else ->
                          "Web"
                  }
              }
          }

          fun SocialProfile.toJson():
              JSONObject =
              JSONObject().apply {

                  put(
                      "url",
                      url
                  )

                  put(
                      "score",
                      score
                  )

                  /*
                   * Always store NULL instead of a possible
                   * Base64 image.
                   */
                  put(
                      "thumbnailUrl",
                      JSONObject.NULL
                  )

                  put(
                      "platform",
                      platform
                  )

                  put(
                      "title",
                      title
                  )
              }

          fun parseProfiles(
              json: String
          ): List<SocialProfile> {

              val list =
                  mutableListOf<SocialProfile>()

              try {

                  val array =
                      JSONArray(json)

                  val count =
                      minOf(
                          array.length(),
                          50
                      )

                  for (
                      i in 0 until count
                  ) {

                      val obj =
                          array.optJSONObject(i)
                              ?: continue

                      val url =
                          obj.optString(
                              "url"
                          )

                      if (
                          url.isBlank()
                      ) {
                          continue
                      }

                      val score =
                          obj
                              .optDouble(
                                  "score",
                                  0.0
                              )
                              .toFloat()
                              .coerceIn(
                                  0f,
                                  1f
                              )

                      val thumbnailUrl =
                          null

                      val platform =
                          obj.optString(
                              "platform",
                              "Web"
                          )

                      val title =
                          obj.optString(
                              "title",
                              ""
                          )

                      list.add(
                          SocialProfile(
                              url = url,
                              score = score,
                              thumbnailUrl =
                                  thumbnailUrl,
                              platform = platform,
                              title = title
                          )
                      )
                  }

              } catch (e: Exception) {

                  Log.e(
                      "NeoFace",
                      "Failed to parse stored profiles",
                      e
                  )
              }

              return list
                  .distinctBy {
                      it.url
                  }
                  .sortedByDescending {
                      it.score
                  }
          }
