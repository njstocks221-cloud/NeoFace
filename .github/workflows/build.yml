          package com.neoface

          import android.app.Application
          import android.net.Uri
          import android.util.Log
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.NonCancellable
          import kotlinx.coroutines.flow.*
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File

          class NeoViewModel(application: Application) :
              AndroidViewModel(application) {

              private val context = application.applicationContext
              private val dao = AppDatabase.get(context).dao()

              private val _busy = MutableStateFlow(false)
              val busy = _busy.asStateFlow()

              private val _status = MutableStateFlow("")
              val status = _status.asStateFlow()

              private val _error = MutableStateFlow<String?>(null)
              val error = _error.asStateFlow()

              private val _selected = MutableStateFlow<SearchRecord?>(null)
              val selected = _selected.asStateFlow()

              private var searchJob: Job? = null

              val history: StateFlow<List<SearchRecord>> = dao.all()
                  .catch { e ->
                      if (e is CancellationException) throw e
                      report(e)
                      emit(emptyList())
                  }
                  .stateIn(
                      viewModelScope,
                      SharingStarted.WhileSubscribed(5000),
                      emptyList()
                  )

              fun clearError() {
                  _error.value = null
              }

              fun showError(message: String) {
                  _error.value = message
              }

              fun open(record: SearchRecord) {
                  _selected.value = record
              }

              fun closeResults() {
                  _selected.value = null
              }

              fun cancelSearch() {
                  searchJob?.cancel()
              }

              fun search(uri: Uri) {
                  if (_busy.value) return

                  val key = Settings.apiKey(context)
                  val url = Settings.baseUrl(context)

                  if (key.isBlank()) {
                      showError("יש להזין מפתח API בהגדרות")
                      return
                  }

                  _busy.value = true
                  _status.value = "מעבד תמונה..."
                  _error.value = null

                  searchJob = viewModelScope.launch {
                      var photo: File? = null
                      var saved = false

                      try {
                          val record = withContext(Dispatchers.IO) {
                              val bitmap = decodeUri(context, uri)
                              val file = try {
                                  savePhoto(context, bitmap).also { photo = it }
                              } finally {
                                  bitmap.recycle()
                              }

                              _status.value = "מחפש קישורים חברתיים..."

                              // On API failure, show the actual error.
                              // Do not disguise failures as empty results.
                              val links = SearchClient.search(file, key, url)

                              val newRecord = SearchRecord(
                                  photoPath = file.absolutePath,
                                  resultsJson = linksToJson(links),
                                  resultCount = links.size
                              )

                              withContext(NonCancellable) {
                                  val id = dao.insert(newRecord)
                                  saved = true
                                  newRecord.copy(id = id)
                              }
                          }

                          _selected.value = record
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          report(e)
                      } finally {
                          if (!saved) {
                              withContext(NonCancellable + Dispatchers.IO) {
                                  photo?.delete()
                              }
                          }
                          _busy.value = false
                          _status.value = ""
                      }
                  }
              }

              fun delete(record: SearchRecord) {
                  viewModelScope.launch {
                      try {
                          withContext(Dispatchers.IO) {
                              dao.delete(record)
                              File(record.photoPath).delete()
                          }
                          if (_selected.value?.id == record.id) {
                              _selected.value = null
                          }
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          report(e)
                      }
                  }
              }

              private fun report(e: Throwable) {
                  Log.e("NeoFace", "Operation failed", e)
                  _error.value = e.message ?: "Operation failed"
              }
          }
