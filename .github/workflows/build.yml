          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoFace-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NeoFace v1.0.${{ github.run_number }}

          body: |
            ## NeoFace v1.0.${{ github.run_number }}

            אפליקציית NeoFace.

            ### התקנה

            1. הורד את app-debug.apk
            2. אפשר התקנה ממקורות לא ידועים במכשיר
            3. התקן את האפליקציה
            4. פתח את הגדרות האפליקציה
            5. הזן את מפתח ה-API
            6. בצע חיפוש

            ### תיקונים בגרסה הזו

            - טיפול בטוח יותר בתשובת השרת
            - הגבלת גודל response
            - קריאת response בצורה מדורגת במקום טעינה בלתי מוגבלת לזיכרון
            - התעלמות מנתוני Base64 של תמונות
            - הגבלת מספר תוצאות ל-50
            - parsing מוגן יותר
            - הגנה על פתיחת URLs
            - טעינת תמונות מקומית בצורה מוקטנת
            - תיקון Layout של מסך התוצאות
            - טיפול טוב יותר בשגיאות HTTP ו-JSON

          files: app/build/outputs/apk/debug/app-debug.apk

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
