          @Composable
          private fun Thumbnail(path: String, modifier: Modifier) {
              val bitmap by produceState<Bitmap?>(null, path) {
                  value = withContext(Dispatchers.IO) {
                      decodeThumbnail(path)
                  }
              }

              val image = bitmap
              if (image != null) {
                  Image(
                      bitmap = image.asImageBitmap(),
                      contentDescription = null,
                      modifier = modifier.clip(RoundedCornerShape(12.dp)),
                      contentScale = ContentScale.Crop
                  )
              } else {
                  Box(
                      modifier.clip(RoundedCornerShape(12.dp))
                          .background(NeoBg),
                      contentAlignment = Alignment.Center
                  ) {
                      Icon(Icons.Default.Image, null, tint = NeoCyan)
                  }
              }
          }

          private fun formattedDate(timestamp: Long): String =
              SimpleDateFormat(
                  "dd/MM/yyyy HH:mm",
                  Locale.getDefault()
              ).format(Date(timestamp))

          @Composable
          private fun ResultsScreen(
              record: SearchRecord,
              onBack: () -> Unit,
              onDelete: () -> Unit,
              onError: (String) -> Unit
          ) {
              val context = LocalContext.current
              var profiles by remember(record.id) {
                  mutableStateOf<List<SocialProfile>>(emptyList())
              }
              var loading by remember(record.id) { mutableStateOf(true) }
              var parseError by remember(record.id) {
                  mutableStateOf<String?>(null)
              }

              LaunchedEffect(record.id, record.resultsJson) {
                  loading = true
                  try {
                      profiles = withContext(Dispatchers.Default) {
                          parseProfiles(record.resultsJson)
                      }
                  } catch (e: CancellationException) {
                      throw e
                  } catch (e: Exception) {
                      parseError = e.message ?: "Cannot read saved results"
                  } finally {
                      loading = false
                  }
              }

              Column(Modifier.fillMaxSize()) {
                  Surface(color = NeoSurface) {
                      Row(
                          Modifier.fillMaxWidth().padding(16.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Thumbnail(record.photoPath, Modifier.size(64.dp))
                          Spacer(Modifier.width(12.dp))

                          Column(Modifier.weight(1f)) {
                              Text(
                                  "תוצאות חיפוש",
                                  color = NeoCyan,
                                  fontWeight = FontWeight.Bold
                              )
                              Text("${record.resultCount} פרופילים")
                              Text(
                                  formattedDate(record.timestamp),
                                  color = Color.Gray,
                                  style = MaterialTheme.typography.bodySmall
                              )
                          }

                          IconButton(onClick = onDelete) {
                              Icon(Icons.Default.Delete, "מחק", tint = NeoRed)
                          }
                      }
                  }

                  LazyColumn(
                      modifier = Modifier.weight(1f).fillMaxWidth(),
                      contentPadding = PaddingValues(12.dp)
                  ) {
                      val message = record.error ?: parseError
                      if (message != null) {
                          item {
                              Surface(
                                  color = NeoRed.copy(alpha = 0.15f),
                                  shape = RoundedCornerShape(12.dp)
                              ) {
                                  Text(
                                      message,
                                      modifier = Modifier.padding(16.dp),
                                      color = NeoRed
                                  )
                              }
                          }
                      }

                      if (loading) {
                          item {
                              Box(
                                  Modifier.fillMaxWidth().padding(32.dp),
                                  contentAlignment = Alignment.Center
                              ) {
                                  CircularProgressIndicator(color = NeoCyan)
                              }
                          }
                      } else if (profiles.isEmpty() && message == null) {
                          item {
                              Text(
                                  "לא נמצאו פרופילים",
                                  modifier = Modifier.fillMaxWidth()
                                      .padding(32.dp),
                                  textAlign = TextAlign.Center
                              )
                          }
                      }

                      items(profiles, key = { it.url }) { profile ->
                          Surface(
                              color = NeoSurface,
                              shape = RoundedCornerShape(14.dp),
                              modifier = Modifier.fillMaxWidth()
                                  .padding(vertical = 6.dp)
                                  .clickable {
                                      try {
                                          context.startActivity(
                                              Intent(
                                                  Intent.ACTION_VIEW,
                                                  Uri.parse(profile.url)
                                              )
                                          )
                                      } catch (e: Exception) {
                                          onError(
                                              e.message ?: "Cannot open link"
                                          )
                                      }
                                  }
                          ) {
                              Column(Modifier.padding(16.dp)) {
                                  Row(
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Text(
                                          profile.platform,
                                          color = NeoCyan,
                                          fontWeight = FontWeight.Bold,
                                          modifier = Modifier.weight(1f)
                                      )
                                      Text(
                                          "${(profile.score * 100).toInt()}%",
                                          color = NeoGreen
                                      )
                                      Spacer(Modifier.width(10.dp))
                                      Icon(
                                          Icons.Default.OpenInNew,
                                          null,
                                          tint = NeoCyan
                                      )
                                  }

                                  if (profile.title.isNotBlank()) {
                                      Spacer(Modifier.height(6.dp))
                                      Text(profile.title, maxLines = 2)
                                  }

                                  Spacer(Modifier.height(4.dp))
                                  Text(
                                      profile.url,
                                      color = Color.Gray,
                                      style = MaterialTheme.typography.bodySmall,
                                      maxLines = 2
                                  )
                              }
                          }
                      }
                  }

                  Button(
                      onClick = onBack,
                      modifier = Modifier.fillMaxWidth().padding(16.dp)
                  ) {
                      Text("חפש שוב")
                  }
              }
          }

          @Composable
