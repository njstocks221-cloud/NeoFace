                      colors =
                          ButtonDefaults
                              .buttonColors(
                                  containerColor =
                                      NeoPurple
                              )
                  ) {

                      Icon(
                          Icons.Default.CameraAlt,
                          null
                      )

                      Spacer(
                          Modifier.width(
                              8.dp
                          )
                      )

                      Text(
                          "חפש שוב"
                      )
                  }
              }
          }

          @Composable
          private fun ProfileCard(
              p: SocialProfile,
              onClick: () -> Unit
          ) {

              Surface(

                  modifier =
                      Modifier
                          .fillMaxWidth()
                          .padding(
                              vertical = 6.dp
                          )
                          .clip(
                              RoundedCornerShape(
                                  14.dp
                              )
                          )
                          .clickable {
                              onClick()
                          },

                  color =
                      NeoSurface
              ) {

                  Row(
                      Modifier.padding(
                          12.dp
                      ),
                      verticalAlignment =
                          Alignment.CenterVertically
                  ) {

                      Surface(

                          Modifier
                              .size(
                                  64.dp
                              )
                              .clip(
                                  RoundedCornerShape(
                                      10.dp
                                  )
                              ),

                          color =
                              NeoBg
                      ) {

                          Box(
                              contentAlignment =
                                  Alignment.Center
                          ) {

                              Icon(
                                  Icons.Default.Person,
                                  null,
                                  tint =
                                      NeoCyan
                              )
                          }
                      }

                      Spacer(
                          Modifier.width(
                              12.dp
                          )
                      )

                      Column(
                          Modifier.weight(
                              1f
                          )
                      ) {

                          Row(
                              verticalAlignment =
                                  Alignment.CenterVertically
                          ) {

                              Text(
                                  platformEmoji(
                                      p.platform
                                  ),
                                  fontSize =
                                      18.sp
                              )

                              Spacer(
                                  Modifier.width(
                                      6.dp
                                  )
                              )

                              Text(
                                  p.platform,
                                  color =
                                      NeoCyan,
                                  style =
                                      MaterialTheme
                                          .typography
                                          .titleMedium,
                                  fontWeight =
                                      FontWeight.Bold
                              )

                              Spacer(
                                  Modifier.weight(
                                      1f
                                  )
                              )

                              if (
                                  p.score > 0
                              ) {

                                  Text(
                                      "${"%.0f".format(
                                          p.score * 100
                                      )}%",
                                      color =
                                          if (
                                              p.score > 0.7f
                                          ) {
                                              NeoGreen
                                          } else {
                                              NeoPurple
                                          },
                                      style =
                                          MaterialTheme
                                              .typography
                                              .labelLarge
                                  )
                              }
                          }

                          if (
                              p.title.isNotBlank()
                          ) {

                              Text(
                                  p.title,
                                  color =
                                      Color.White,
                                  style =
                                      MaterialTheme
                                          .typography
                                          .bodyMedium,
                                  maxLines =
                                      1
                              )
                          }

                          Text(
                              p.url,
                              color =
                                  Color.Gray,
                              style =
                                  MaterialTheme
                                      .typography
                                      .bodySmall,
                              maxLines =
                                  1
                          )
                      }

                      Icon(
                          Icons.Default.OpenInNew,
                          null,
                          tint =
                              NeoCyan
                      )
                  }
              }
          }

          private fun platformEmoji(
              p: String
          ): String {

              return when (p) {

                  "Instagram" ->
                      "📷"

                  "TikTok" ->
                      "🎵"

                  "Facebook" ->
                      "📘"

                  "X" ->
                      "🐦"

                  "LinkedIn" ->
                      "💼"

                  "YouTube" ->
                      "▶️"

                  "VK" ->
                      "🇷🇺"

                  "Telegram" ->
                      "✈️"

                  "Pinterest" ->
                      "📌"

                  "Reddit" ->
                      "👽"

                  else ->
                      "🌐"
              }
          }

          private fun openUrl(
              ctx: Context,
              url: String
          ) {

              try {

                  val uri =
                      Uri.parse(
                          url
                      )

                  val scheme =
                      uri.scheme
                          ?.lowercase()

                  if (
                      scheme != "http" &&
                      scheme != "https"
                  ) {
                      return
                  }

                  val intent =
                      Intent(
                          Intent.ACTION_VIEW,
                          uri
                      ).apply {

                          addFlags(
                              Intent.FLAG_ACTIVITY_NEW_TASK
                          )
                      }

                  ctx.startActivity(
                      intent
                  )

              } catch (
                  e: Exception
              ) {

                  Log.e(
                      "NeoFace",
                      "Failed to open URL: $url",
                      e
                  )
              }
          }
