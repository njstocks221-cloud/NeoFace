          data class NavItem(
              val route: String,
              val label: String,
              val icon: ImageVector
          )

          @Composable
          fun AppRoot() {

              val ctx =
                  LocalContext.current

              val db =
                  remember {
                      AppDatabase.get(
                          ctx
                      )
                  }

              val dao =
                  db.dao()

              val nav =
                  rememberNavController()

              val backStack by
                  nav.currentBackStackEntryAsState()

              val current =
                  backStack
                      ?.destination
                      ?.route
                      ?: "camera"

              val items =
                  listOf(

                      NavItem(
                          "camera",
                          "מצלמה",
                          Icons.Default.CameraAlt
                      ),

                      NavItem(
                          "history",
                          "היסטוריה",
                          Icons.Default.History
                      ),

                      NavItem(
                          "settings",
                          "הגדרות",
                          Icons.Default.Settings
                      )
                  )

              Scaffold(

                  bottomBar = {

                      NavigationBar(
                          containerColor =
                              NeoSurface
                      ) {

                          items.forEach { item ->

                              val selected =
                                  current ==
                                      item.route ||
                                      current.startsWith(
                                          "${item.route}/"
                                      )

                              NavigationBarItem(

                                  selected =
                                      selected,

                                  onClick = {

                                      if (
                                          !selected
                                      ) {

                                          nav.navigate(
                                              item.route
                                          ) {

                                              popUpTo(
                                                  "camera"
                                              ) {
                                                  inclusive =
                                                      false
                                              }

                                              launchSingleTop =
                                                  true
                                          }
                                      }
                                  },

                                  icon = {
                                      Icon(
                                          item.icon,
                                          item.label
                                      )
                                  },

                                  label = {
                                      androidx.compose.material3.Text(
                                          item.label
                                      )
                                  },

                                  colors =
                                      NavigationBarItemDefaults
                                          .colors(
                                              selectedIconColor =
                                                  NeoCyan,
                                              selectedTextColor =
                                                  NeoCyan,
                                              indicatorColor =
                                                  NeoPurple
                                          )
                              )
                          }
                      }
                  }

              ) { pad ->

                  NavHost(
                      navController = nav,
                      startDestination = "camera",
                      modifier =
                          Modifier.padding(
                              pad
                          )
                  ) {

                      composable(
                          "camera"
                      ) {

                          CameraScreen(
                              dao
                          ) { id ->

                              nav.navigate(
                                  "results/$id"
                              )
                          }
                      }

                      composable(
                          route = "results/{id}",
                          arguments =
                              listOf(
                                  navArgument(
                                      "id"
                                  ) {
                                      type =
                                          NavType.LongType
                                  }
                              )
                      ) { entry ->

                          val id =
                              entry.arguments
                                  ?.getLong(
                                      "id"
                                  )
                                  ?: 0L

                          ResultsScreen(
                              dao = dao,
                              id = id,
                              onBackToCamera = {
                                  nav.navigate(
                                      "camera"
                                  )
                              }
                          )
                      }

                      composable(
                          "history"
                      ) {

                          HistoryScreen(
                              dao
                          ) { id ->

                              nav.navigate(
                                  "results/$id"
                              )
                          }
                      }

                      composable(
                          "settings"
                      ) {

                          SettingsScreen()
                      }
                  }
              }
          }
