          cat > app/src/main/java/com/neoface/Data.kt <<'EOF'
          package com.neoface

          import android.content.Context
          import androidx.room.*
          import kotlinx.coroutines.flow.Flow

          // Keep the original database schema so existing history remains usable.
          @Entity(tableName = "searches")
          data class SearchRecord(
              @PrimaryKey(autoGenerate = true) val id: Long = 0,
              val photoPath: String,
              val timestamp: Long = System.currentTimeMillis(),
              val resultsJson: String,
              val resultCount: Int = 0,
              val error: String? = null
          )

          @Dao
          interface SearchDao {
              @Insert
              suspend fun insert(record: SearchRecord): Long

              @Query("SELECT * FROM searches ORDER BY timestamp DESC")
              fun all(): Flow<List<SearchRecord>>

              @Delete
              suspend fun delete(record: SearchRecord)
          }

          @Database(
              entities = [SearchRecord::class],
              version = 1,
              exportSchema = false
          )
          abstract class AppDatabase : RoomDatabase() {
              abstract fun dao(): SearchDao

              companion object {
                  @Volatile private var instance: AppDatabase? = null

                  fun get(context: Context): AppDatabase =
                      instance ?: synchronized(this) {
                          instance ?: Room.databaseBuilder(
                              context.applicationContext,
                              AppDatabase::class.java,
                              "neoface.db"
                          ).build().also { instance = it }
                      }
              }
          }

          object Settings {
              const val DEFAULT_URL = "https://api.faceseek.online"

              private fun prefs(context: Context) =
                  context.getSharedPreferences(
                      "neoface_prefs",
                      Context.MODE_PRIVATE
                  )

              fun apiKey(context: Context): String =
                  prefs(context).getString("api_key", "") ?: ""

              fun baseUrl(context: Context): String =
                  prefs(context).getString("base_url", DEFAULT_URL)
                      ?: DEFAULT_URL

              fun save(context: Context, key: String, url: String) {
                  prefs(context).edit()
                      .putString("api_key", key.trim())
                      .putString("base_url", url.trim().trimEnd('/'))
                      .apply()
              }
          }
          EOF

          cat > app/src/main/java/com/neoface/SocialLinks.kt <<'EOF'
          package com.neoface

          import android.content.ActivityNotFoundException
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import okhttp3.HttpUrl
          import okhttp3.HttpUrl.Companion.toHttpUrlOrNull
          import java.util.Locale

          data class SocialSite(
              val name: String,
              val domains: List<String>,
              val packages: List<String>
          )

          data class SocialLink(
              val url: String,
              val platform: String
          )

          object SocialLinks {
              private val sites = listOf(
                  SocialSite(
                      "Instagram",
                      listOf("instagram.com"),
                      listOf("com.instagram.android")
                  ),
                  SocialSite(
                      "Facebook",
                      listOf("facebook.com", "fb.com"),
                      listOf("com.facebook.katana", "com.facebook.lite")
                  ),
                  SocialSite(
                      "TikTok",
                      listOf("tiktok.com"),
                      listOf(
                          "com.zhiliaoapp.musically",
                          "com.ss.android.ugc.trill"
                      )
                  ),
                  SocialSite(
                      "X",
                      listOf("x.com", "twitter.com"),
                      listOf("com.twitter.android")
                  ),
                  SocialSite(
                      "LinkedIn",
                      listOf("linkedin.com"),
                      listOf("com.linkedin.android")
                  ),
                  SocialSite(
                      "YouTube",
                      listOf("youtube.com", "youtu.be"),
                      listOf("com.google.android.youtube")
                  ),
                  SocialSite(
                      "Telegram",
                      listOf("t.me", "telegram.me"),
                      listOf(
                          "org.telegram.messenger",
                          "org.thunderdog.challegram"
                      )
                  ),
                  SocialSite(
                      "Reddit",
                      listOf("reddit.com"),
                      listOf("com.reddit.frontpage")
                  ),
                  SocialSite(
                      "Pinterest",
                      listOf("pinterest.com", "pin.it"),
                      listOf("com.pinterest")
                  ),
                  SocialSite(
                      "Snapchat",
                      listOf("snapchat.com"),
                      listOf("com.snapchat.android")
                  ),
                  SocialSite(
                      "Threads",
                      listOf("threads.net", "threads.com"),
                      listOf("com.instagram.barcelona")
                  ),
                  SocialSite(
                      "VK",
                      listOf("vk.com"),
                      listOf("com.vkontakte.android")
                  ),
                  SocialSite(
                      "OK",
                      listOf("ok.ru"),
                      listOf("ru.ok.android")
                  ),
                  SocialSite(
                      "Bluesky",
                      listOf("bsky.app"),
                      listOf("xyz.blueskyweb.app")
                  ),
                  SocialSite(
                      "Twitch",
                      listOf("twitch.tv"),
                      listOf("tv.twitch.android.app")
                  ),
                  SocialSite(
                      "Tumblr",
                      listOf("tumblr.com"),
                      listOf("com.tumblr")
                  )
              )

              private fun siteFor(url: HttpUrl): SocialSite? {
                  val host = url.host.lowercase(Locale.ROOT)
                  return sites.firstOrNull { site ->
                      site.domains.any { domain ->
                          host == domain || host.endsWith(".$domain")
                      }
                  }
              }

              fun parse(raw: String): SocialLink? {
                  val address = raw.trim().toHttpUrlOrNull() ?: return null
                  if (address.username.isNotEmpty() ||
                      address.password.isNotEmpty()) return null
                  if (address.port != 80 && address.port != 443) return null

                  val site = siteFor(address) ?: return null

                  // Only accept links to approved social domains.
                  // Do not invent usernames or convert posts into profiles.
                  val normalized = address.newBuilder()
                      .scheme("https")
                      .port(443)
                      .fragment(null)
                      .build()

                  return SocialLink(normalized.toString(), site.name)
              }

              fun open(context: Context, link: SocialLink) {
                  val address = link.url.toHttpUrlOrNull()
                      ?: throw IllegalArgumentException("Invalid social link")
                  val site = siteFor(address)
                      ?: throw IllegalArgumentException("Unsupported social link")

                  val uri = Uri.parse(address.toString())

                  // First try the platform's official Android apps.
                  // The app must have an activity capable of handling this URL.
                  for (packageName in site.packages) {
                      val intent = Intent(Intent.ACTION_VIEW, uri)
                          .addCategory(Intent.CATEGORY_BROWSABLE)
                          .setPackage(packageName)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)

                      try {
                          context.startActivity(intent)
                          return
                      } catch (_: ActivityNotFoundException) {
                          // App is missing or cannot handle this particular URL.
                      } catch (_: SecurityException) {
                          // Try another available handler.
                      }
                  }

                  // Fallback to Android's normal HTTPS handler:
                  // typically the browser, or another associated social app.
                  context.startActivity(
                      Intent(Intent.ACTION_VIEW, uri)
                          .addCategory(Intent.CATEGORY_BROWSABLE)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  )
              }
          }
          EOF

          cat > app/src/main/java/com/neoface/Images.kt <<'EOF'
          package com.neoface

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Matrix
          import android.net.Uri
          import androidx.exifinterface.media.ExifInterface
          import java.io.File
          import java.io.IOException
          import java.util.UUID

          fun decodeUri(context: Context, uri: Uri): Bitmap {
              val resolver = context.contentResolver
              val bounds = BitmapFactory.Options().apply {
                  inJustDecodeBounds = true
              }

              (resolver.openInputStream(uri)
                  ?: throw IOException("Cannot open image")).use {
                  BitmapFactory.decodeStream(it, null, bounds)
              }

              if (bounds.outWidth <= 0 || bounds.outHeight <= 0) {
                  throw IOException("Unsupported or damaged image")
              }

              var sample = 1
              while (
                  bounds.outWidth / sample > 512 ||
                  bounds.outHeight / sample > 512
              ) {
                  sample *= 2
              }

              val options = BitmapFactory.Options().apply {
                  inSampleSize = sample
                  inPreferredConfig = Bitmap.Config.ARGB_8888
              }

              val bitmap = (resolver.openInputStream(uri)
                  ?: throw IOException("Cannot reopen image")).use {
                  BitmapFactory.decodeStream(it, null, options)
              } ?: throw IOException("Cannot decode image")

              val orientation = try {
                  resolver.openInputStream(uri)?.use {
                      ExifInterface(it).getAttributeInt(
                          ExifInterface.TAG_ORIENTATION,
                          ExifInterface.ORIENTATION_NORMAL
                      )
                  } ?: ExifInterface.ORIENTATION_NORMAL
              } catch (_: IOException) {
                  ExifInterface.ORIENTATION_NORMAL
              }

              val matrix = Matrix()
              when (orientation) {
                  ExifInterface.ORIENTATION_FLIP_HORIZONTAL ->
                      matrix.setScale(-1f, 1f)
                  ExifInterface.ORIENTATION_ROTATE_180 ->
                      matrix.setRotate(180f)
                  ExifInterface.ORIENTATION_FLIP_VERTICAL ->
                      matrix.setScale(1f, -1f)
                  ExifInterface.ORIENTATION_TRANSPOSE -> {
                      matrix.setRotate(90f)
                      matrix.postScale(-1f, 1f)
                  }
                  ExifInterface.ORIENTATION_ROTATE_90 ->
                      matrix.setRotate(90f)
                  ExifInterface.ORIENTATION_TRANSVERSE -> {
                      matrix.setRotate(-90f)
                      matrix.postScale(-1f, 1f)
                  }
                  ExifInterface.ORIENTATION_ROTATE_270 ->
                      matrix.setRotate(-90f)
              }

              if (matrix.isIdentity) return bitmap

              return try {
                  Bitmap.createBitmap(
                      bitmap, 0, 0, bitmap.width, bitmap.height,
                      matrix, true
                  ).also {
                      if (it !== bitmap) bitmap.recycle()
                  }
              } catch (e: Exception) {
                  bitmap.recycle()
                  throw e
              }
          }

          fun savePhoto(context: Context, bitmap: Bitmap): File {
              val directory = File(context.filesDir, "photos")

              if (!directory.exists() && !directory.mkdirs()) {
                  throw IOException("Cannot create photo directory")
              }

              val file = File(directory, "face_${UUID.randomUUID()}.jpg")
              try {
                  file.outputStream().use {
                      if (!bitmap.compress(Bitmap.CompressFormat.JPEG, 85, it)) {
                          throw IOException("Cannot save image")
                      }
                  }
                  return file
              } catch (e: Exception) {
                  file.delete()
                  throw e
              }
          }
          EOF

          cat > app/src/main/java/com/neoface/SearchClient.kt <<'EOF'
          package com.neoface

          import com.google.gson.stream.JsonReader
          import com.google.gson.stream.JsonToken
          import kotlinx.coroutines.suspendCancellableCoroutine
          import okhttp3.*
          import okhttp3.HttpUrl.Companion.toHttpUrlOrNull
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.RequestBody.Companion.asRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.IOException
          import java.util.concurrent.TimeUnit
          import kotlin.coroutines.resumeWithException

          object SearchClient {
              private val http = OkHttpClient.Builder()
                  .connectTimeout(45, TimeUnit.SECONDS)
                  .readTimeout(300, TimeUnit.SECONDS)
                  .writeTimeout(120, TimeUnit.SECONDS)
                  .callTimeout(330, TimeUnit.SECONDS)
                  .followRedirects(false)
                  .followSslRedirects(false)
                  .build()

              suspend fun search(
                  photo: File,
                  apiKey: String,
                  baseUrl: String
              ): List<SocialLink> {
                  require(apiKey.isNotBlank()) { "Missing API key" }

                  val base = baseUrl.trim().toHttpUrlOrNull()
                      ?: throw IOException("Invalid server URL")

                  require(base.isHttps) { "Server URL must use HTTPS" }
                  require(base.username.isEmpty() && base.password.isEmpty()) {
                      "Server URL must not contain credentials"
                  }

                  val endpoint = base.newBuilder()
                      .query(null)
                      .fragment(null)
                      .encodedPath(
                          base.encodedPath.trimEnd('/') + "/v1/api/search"
                      )
                      .build()

                  val body = MultipartBody.Builder()
                      .setType(MultipartBody.FORM)
                      .addFormDataPart(
                          "file",
                          "face.jpg",
                          photo.asRequestBody("image/jpeg".toMediaType())
                      )
                      .build()

                  val request = Request.Builder()
                      .url(endpoint)
                      .header("X-API-Key", apiKey.trim())
                      .header("Accept", "application/json")
                      .post(body)
                      .build()

                  val call = http.newCall(request)

                  return suspendCancellableCoroutine { continuation ->
                      continuation.invokeOnCancellation { call.cancel() }

                      call.enqueue(object : Callback {
                          override fun onFailure(call: Call, e: IOException) {
                              if (continuation.isActive) {
                                  continuation.resumeWithException(e)
                              }
                          }

                          override fun onResponse(
                              call: Call,
                              response: Response
                          ) {
                              try {
                                  val links = response.use {
                                      if (!it.isSuccessful) {
                                          val detail = it.peekBody(1024)
                                              .string().take(300)
                                          throw IOException(
                                              "HTTP ${it.code}: $detail"
                                          )
                                      }

                                      val responseBody = it.body
                                          ?: throw IOException("Empty response")

                                      JsonReader(
                                          responseBody.charStream()
                                      ).use { reader ->
                                          readResults(reader, call)
                                      }
                                  }

                                  if (continuation.isActive) {
                                      continuation.resumeWith(
                                          Result.success(links)
                                      )
                                  }
                              } catch (e: Exception) {
                                  if (continuation.isActive) {
                                      continuation.resumeWithException(e)
                                  }
                              }
                          }
                      })
                  }
              }

              private fun readUrl(reader: JsonReader): String {
                  return if (reader.peek() == JsonToken.STRING) {
                      val text = reader.nextString()
                      if (text.length <= 8192) text else ""
                  } else {
                      reader.skipValue()
                      ""
                  }
              }

              private fun readResults(
                  reader: JsonReader,
                  call: Call
              ): List<SocialLink> {
                  if (reader.peek() != JsonToken.BEGIN_OBJECT) {
                      throw IOException("Expected a JSON response object")
                  }

                  // No first-50 cutoff: collect all unique social links
                  // returned in this response's results array.
                  val links = linkedMapOf<String, SocialLink>()
                  var foundResults = false

                  reader.beginObject()
                  while (reader.hasNext()) {
                      if (call.isCanceled()) {
                          throw IOException("Search cancelled")
                      }

                      if (reader.nextName() != "results") {
                          reader.skipValue()
                          continue
                      }

                      if (reader.peek() != JsonToken.BEGIN_ARRAY) {
                          throw IOException("Response 'results' is not an array")
                      }

                      foundResults = true
                      reader.beginArray()

                      while (reader.hasNext()) {
                          if (call.isCanceled()) {
                              throw IOException("Search cancelled")
                          }

                          if (reader.peek() != JsonToken.BEGIN_OBJECT) {
                              reader.skipValue()
                              continue
                          }

                          reader.beginObject()

                          while (reader.hasNext()) {
                              when (reader.nextName()) {
                                  "source_url", "url", "profile_url" -> {
                                      val link = SocialLinks.parse(readUrl(reader))
                                      if (link != null) {
                                          links[link.url] = link
                                      }
                                  }
                                  // Ignore images, scores, titles and all
                                  // other fields. Never scan image URLs.
                                  else -> reader.skipValue()
                              }
                          }

                          reader.endObject()
                      }

                      reader.endArray()
                  }

                  reader.endObject()

                  if (!foundResults) {
                      throw IOException(
                          "Response has no 'results' array. Check the API endpoint."
                      )
                  }

                  return links.values.toList()
              }
          }

          fun linksToJson(links: List<SocialLink>): String =
              JSONArray().apply {
                  links.forEach { link ->
                      put(JSONObject().apply {
                          put("url", link.url)
                          put("platform", link.platform)
                      })
                  }
              }.toString()

          fun parseLinks(json: String): List<SocialLink> {
              val array = JSONArray(json)
              val links = linkedMapOf<String, SocialLink>()

              for (index in 0 until array.length()) {
                  val item = array.optJSONObject(index) ?: continue
                  // Also filters non-social URLs out of old history records.
                  val link = SocialLinks.parse(item.optString("url")) ?: continue
                  links[link.url] = link
              }

              return links.values.toList()
          }
          EOF

