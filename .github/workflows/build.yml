name: Build NeoFace APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # Checkout
      # -----------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # -----------------------------------------
      # Java 17
      # -----------------------------------------

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # -----------------------------------------
      # Gradle
      # -----------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4


      # -----------------------------------------
      # Android SDK
      #
      # IMPORTANT:
      # packages: ''
      #
      # This prevents setup-android from trying
      # to install the obsolete "tools" package.
      # -----------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''


      # -----------------------------------------
      # Install Android SDK packages required
      # by compileSdk 34
      # -----------------------------------------

      - name: Install Android SDK packages
        shell: bash
        run: |

          set -e

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses >/dev/null || true

          echo "Installing required Android SDK packages..."

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "Android SDK packages installed successfully."

          echo ""
          echo "SDK version:"
          sdkmanager --version

          echo ""
          echo "Installed platforms:"
          sdkmanager --list_installed | grep "platforms;android-34" || true

          echo ""
          echo "Installed build tools:"
          sdkmanager --list_installed | grep "build-tools;34.0.0" || true


      # -----------------------------------------
      # Build project directories
      # -----------------------------------------

      - name: Create project directories
        shell: bash
        run: |

          set -e

          mkdir -p app/src/main/java/com/neoface/data
          mkdir -p app/src/main/java/com/neoface/engine
          mkdir -p app/src/main/java/com/neoface/ui

          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml


      # -----------------------------------------
      # local.properties
      # -----------------------------------------

      - name: Create local.properties
        shell: bash
        run: |

          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${ANDROID_HOME}"


      # -----------------------------------------
      # settings.gradle
      # -----------------------------------------

      - name: Create settings.gradle
        shell: bash
        run: |

          cat > settings.gradle << 'EOF'

          pluginManagement {

              repositories {

                  google()

                  mavenCentral()

                  gradlePluginPortal()
              }
          }


          dependencyResolutionManagement {

              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {

                  google()

                  mavenCentral()
              }
          }


          rootProject.name = "NeoFace"

          include ':app'

          EOF


      # -----------------------------------------
      # Root build.gradle
      # -----------------------------------------

      - name: Create root build.gradle
        shell: bash
        run: |

          cat > build.gradle << 'EOF'

          plugins {

              id 'com.android.application'
                  version '8.2.0'
                  apply false

              id 'org.jetbrains.kotlin.android'
                  version '1.9.20'
                  apply false

              id 'org.jetbrains.kotlin.kapt'
                  version '1.9.20'
                  apply false
          }

          EOF


      # -----------------------------------------
      # gradle.properties
      # -----------------------------------------

      - name: Create gradle.properties
        shell: bash
        run: |

          cat > gradle.properties << 'EOF'

          org.gradle.jvmargs=-Xmx2048m

          android.useAndroidX=true

          kotlin.code.style=official

          android.nonTransitiveRClass=true

          EOF


      # -----------------------------------------
      # app/build.gradle
      # -----------------------------------------

      - name: Create app/build.gradle
        shell: bash
        run: |

          cat > app/build.gradle << 'EOF'

          plugins {

              id 'com.android.application'

              id 'org.jetbrains.kotlin.android'

              id 'org.jetbrains.kotlin.kapt'
          }


          android {

              namespace 'com.neoface'

              compileSdk 34


              defaultConfig {

                  applicationId "com.neoface"

                  minSdk 24

                  targetSdk 33

                  versionCode 2

                  versionName "1.0.1"
              }


              buildFeatures {

                  compose true

                  buildConfig true
              }


              composeOptions {

                  kotlinCompilerExtensionVersion '1.5.4'
              }


              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17
              }


              kotlinOptions {

                  jvmTarget = '17'
              }


              packagingOptions {

                  resources.excludes.add(
                      "META-INF/*"
                  )
              }
          }


          dependencies {

              implementation "androidx.room:room-runtime:2.6.1"

              implementation "androidx.room:room-ktx:2.6.1"

              kapt "androidx.room:room-compiler:2.6.1"


              implementation "androidx.navigation:navigation-compose:2.7.7"


              implementation platform(
                  'androidx.compose:compose-bom:2024.02.00'
              )

              implementation 'androidx.compose.ui:ui'

              implementation 'androidx.compose.material3:material3'

              implementation 'androidx.compose.material:material-icons-extended'


              implementation 'androidx.activity:activity-compose:1.8.2'


              implementation 'com.google.accompanist:accompanist-permissions:0.32.0'


              implementation 'com.squareup.okhttp3:okhttp:4.12.0'


              implementation 'io.coil-kt:coil-compose:2.5.0'


              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'


              implementation 'androidx.core:core-ktx:1.12.0'
          }

          EOF


      # -----------------------------------------
      # AndroidManifest.xml
      # -----------------------------------------

      - name: Create AndroidManifest.xml
        shell: bash
        run: |

          cat > app/src/main/AndroidManifest.xml << 'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">


              <uses-permission
                  android:name="android.permission.CAMERA"
              />

              <uses-permission
                  android:name="android.permission.INTERNET"
              />

              <uses-permission
                  android:name="android.permission.READ_EXTERNAL_STORAGE"
              />


              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="false"
              />


              <queries>

                  <intent>

                      <action
                          android:name="android.media.action.IMAGE_CAPTURE"
                      />

                  </intent>


                  <intent>

                      <action
                          android:name="android.intent.action.GET_CONTENT"
                      />

                      <category
                          android:name="android.intent.category.OPENABLE"
                      />

                      <data
                          android:mimeType="image/*"
                      />

                  </intent>

              </queries>


              <application

                  android:label="NeoFace"

                  android:icon="@drawable/ic_neo_logo"

                  android:roundIcon="@drawable/ic_neo_logo"

                  android:theme="@style/Theme.NeoFace"

                  android:allowBackup="true"

                  android:usesCleartextTraffic="true"

                  android:supportsRtl="true"

                  android:extractNativeLibs="true"

                  android:requestLegacyExternalStorage="true"

                  tools:targetApi="33">


                  <activity

                      android:name=".MainActivity"

                      android:exported="true"

                      android:theme="@style/Theme.NeoFace"

                      android:screenOrientation="portrait">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN"
                          />

                          <category
                              android:name="android.intent.category.LAUNCHER"
                          />

                      </intent-filter>


                  </activity>

              </application>


          </manifest>

          EOF


      # -----------------------------------------
      # Theme
      # -----------------------------------------

      - name: Create themes.xml
        shell: bash
        run: |

          cat > app/src/main/res/values/themes.xml << 'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="Theme.NeoFace"
                  parent="android:style/Theme.Material.NoActionBar"
              >

                  <item name="android:statusBarColor">
                      #0A0E27
                  </item>

                  <item name="android:navigationBarColor">
                      #0A0E27
                  </item>

                  <item name="android:windowBackground">
                      #0A0E27
                  </item>

              </style>

          </resources>

          EOF


      # -----------------------------------------
      # Strings
      # -----------------------------------------

      - name: Create strings.xml
        shell: bash
        run: |

          cat > app/src/main/res/values/strings.xml << 'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">
                  NeoFace
              </string>

          </resources>

          EOF


      # -----------------------------------------
      # App icon
      # -----------------------------------------

      - name: Create app icon
        shell: bash
        run: |

          cat > app/src/main/res/drawable/ic_neo_logo.xml << 'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <vector

              xmlns:android="http://schemas.android.com/apk/res/android"

              android:width="108dp"

              android:height="108dp"

              android:viewportWidth="108"

              android:viewportHeight="108">


              <path

                  android:fillColor="#0A0E27"

                  android:pathData="M0,0h108v108h-108z"
              />


              <path

                  android:strokeColor="#7C4DFF"

                  android:strokeWidth="3"

                  android:fillColor="#00000000"

                  android:pathData="M54,14 A40,40 0 1,1 53.99,14 Z"
              />


              <path

                  android:strokeColor="#3300E5FF"

                  android:strokeWidth="6"

                  android:strokeLineCap="round"

                  android:fillColor="#00000000"

                  android:pathData="M18,54 L90,54"
              />


              <path

                  android:strokeColor="#00E5FF"

                  android:strokeWidth="6"

                  android:strokeLineCap="round"

                  android:strokeLineJoin="round"

                  android:fillColor="#00000000"

                  android:pathData="M36,76 L36,32 L72,76 L72,32"
              />


              <path

                  android:fillColor="#00E5FF"

                  android:pathData="M46,46 m-3.5,0 a3.5,3.5 0 1,0 7,0 a3.5,3.5 0 1,0 -7,0"
              />


              <path

                  android:fillColor="#00E5FF"

                  android:pathData="M62,46 m-3.5,0 a3.5,3.5 0 1,0 7,0 a3.5,3.5 0 1,0 -7,0"
              />


              <path

                  android:strokeColor="#00E5FF"

                  android:strokeWidth="3"

                  android:strokeLineCap="round"

                  android:fillColor="#00000000"

                  android:pathData="M46,62 Q54,68 62,62"
              />

          </vector>

          EOF


      # -----------------------------------------
      # Build
      # -----------------------------------------

      - name: Build Debug APK
        shell: bash
        run: |

          set -e

          echo "Starting Gradle build..."

          gradle assembleDebug --stacktrace --no-daemon


      # -----------------------------------------
      # Verify APK exists
      # -----------------------------------------

      - name: Verify APK
        shell: bash
        run: |

          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "ERROR: APK was not created."

            exit 1

          fi

          echo "APK successfully created."

          ls -lh "$APK"


      # -----------------------------------------
      # Upload APK as GitHub artifact
      # -----------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: NeoFace-APK

          path:
            app/build/outputs/apk/debug/app-debug.apk


      # -----------------------------------------
      # Create GitHub Release
      # -----------------------------------------

      - name: Create Release
        uses: softprops/action-gh-release@v2

        with:

          tag_name:
            v1.0.${{ github.run_number }}

          name:
            NeoFace v1.0.${{ github.run_number }}

          body: |
            ## NeoFace v1.0.${{ github.run_number }}

            NeoFace Android APK.

            ### Installation

            1. Download app-debug.apk
            2. Enable installation from unknown sources
            3. Install the application
            4. Open NeoFace
            5. Enter your API key
            6. Start a search

            ### Build fixes

            - Fixed Android SDK setup
            - Removed obsolete Android SDK "tools" package
            - Explicitly installed Android 34 platform
            - Explicitly installed Build Tools 34.0.0
            - Added safer APK verification
            - Improved build logging

          files:
            app/build/outputs/apk/debug/app-debug.apk

        env:

          GITHUB_TOKEN:
            ${{ secrets.GITHUB_TOKEN }}
