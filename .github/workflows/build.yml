name: Build NeoFace APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build project files
        run: |
          mkdir -p app/src/main/java/com/neoface/data
          mkdir -p app/src/main/java/com/neoface/engine
          mkdir -p app/src/main/java/com/neoface/ui
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NeoFace"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
              id 'org.jetbrains.kotlin.kapt' version '1.9.20' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
              id 'org.jetbrains.kotlin.kapt'
          }
          android {
              namespace 'com.neoface'
              compileSdk 34
              defaultConfig {
                  applicationId "com.neoface"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0.0"
              }
              buildFeatures { compose true; buildConfig true }
              composeOptions { kotlinCompilerExtensionVersion '1.5.4' }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
              packagingOptions {
                  resources.excludes.add("META-INF/*")
              }
          }
          dependencies {
              implementation "androidx.room:room-runtime:2.6.1"
              implementation "androidx.room:room-ktx:2.6.1"
              kapt "androidx.room:room-compiler:2.6.1"
              implementation "androidx.navigation:navigation-compose:2.7.7"
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation 'com.google.accompanist:accompanist-permissions:0.32.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'io.coil-kt:coil-compose:2.5.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              
              <queries>
                  <intent>
                      <action android:name="android.media.action.IMAGE_CAPTURE" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.GET_CONTENT" />
                      <category android:name="android.intent.category.OPENABLE" />
                      <data android:mimeType="image/*" />
                  </intent>
              </queries>

              <application
                  android:label="NeoFace"
                  android:icon="@drawable/ic_neo_logo"
                  android:roundIcon="@drawable/ic_neo_logo"
                  android:theme="@style/Theme.NeoFace"
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:supportsRtl="true"
                  android:extractNativeLibs="true"
                  android:requestLegacyExternalStorage="true"
                  tools:targetApi="33">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.NeoFace"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.NeoFace" parent="android:Theme.Material.NoActionBar">
                  <item name="android:statusBarColor">#0A0E27</item>
                  <item name="android:navigationBarColor">#0A0E27</item>
                  <item name="android:windowBackground">#0A0E27</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
